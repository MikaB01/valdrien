  return `<svg viewBox="0 0 40 40" aria-hidden="true">${formen[name]}</svg>`;
}

// Der Spielstand: alle Spieler nach Münzen sortiert (wird im Geldbeutel gezeigt)
function standTafel() {
  const werte = spiel.spieler.map(s => s.muenzen);
  const max = Math.max(...werte), min = Math.min(...werte);
  const reihe = spiel.spieler.map((_, i) => i).sort((a, b) => werte[b] - werte[a]);
  const zeilen = reihe.map(i => {
    const s = spiel.spieler[i];
    const chips = [];
    if (max !== min && s.muenzen === max) chips.push(`<span class="chip chip-gold">meiste</span>`);
    if (max !== min && s.muenzen === min) chips.push(`<span class="chip">wenigste</span>`);
    if (s.frei && !s.benutzt) chips.push(`<span class="chip chip-wald">Fähigkeit bereit</span>`);
    else if (s.frei) chips.push(`<span class="chip">enttarnt</span>`);
    return `
      <div class="stand-zeile">
        <span class="stand-name">${sicher(s.name)} ${chips.join("")}</span>
        <span class="stand-muenzen">${s.muenzen}<span class="muenze-klein" aria-hidden="true"></span></span>
      </div>`;
  }).join("");
  return `<div class="stand-liste">${zeilen}</div>`;
}

// Die Spielübersicht: von hier aus geht es überall hin
function bildschirmUebersicht() {
  const bereit = spiel.spieler.filter(s => s.frei && !s.benutzt).length;
  const gesamt = minuten() * 60000;
  return `
    <div class="kopf"><span class="eyebrow">${A().titel}</span><h2>Das Abenteuer</h2></div>
    ${spiel.abenteuerLaeuft && spiel.timerEnde ? `
      <div class="zeitgeber" role="timer">
        <span class="etikett">Nächstes Ereignis in</span>
        <span class="zeit" id="restzeit">${zeitText(restzeitMs())}</span>
        <div class="balken"><div id="balken-fuellung" style="width:${Math.min(100, 100 * restzeitMs() / gesamt)}%"></div></div>
      </div>` : ""}
    ${spiel.seherBonus ? `<p class="hinweis">Die Nacht der Seher: Bis zum nächsten Ereignis bringt ein Treffer beim Raten 5 Münzen.</p>` : ""}
    ${spiel.siegBonus ? `<p class="hinweis">Gewinnt ${name(spiel.siegBonus.wer)} das nächste Minispiel, gibt es ${spiel.siegBonus.betrag} Münzen extra.</p>` : ""}
    ${spiel.ratenGratis ? `<p class="hinweis">Lose Zungen: Bis zum nächsten Ereignis kostet Raten keine Münze.</p>` : ""}
    <div class="kacheln">
      <button class="kachel kachel-breit" onclick="ratenBeginnen()">
        ${symbol("raten")}
        <span class="kachel-inhalt">
          <span class="kachel-titel">Auf eine Rolle raten</span>
          <span class="kachel-text">${spiel.ratenGratis ? "Raten kostet gerade nichts" : "Ein Tipp kostet 1 Münze"}, ein Treffer bringt ${spiel.seherBonus ? 5 : 3}</span>
        </span>
      </button>
      <button class="kachel kachel-breit" onclick="faehigkeitBeginnen()" ${bereit ? "" : 'style="border-color: var(--linie)"'}>
        ${symbol("faehigkeit")}
        <span class="kachel-inhalt">
          <span class="kachel-titel">Besondere Fähigkeit einsetzen</span>
          <span class="kachel-text">${bereit
            ? `${bereit} ${bereit === 1 ? "Person kann" : "Personen können"} jetzt eine Fähigkeit einsetzen`
            : "Wird frei, sobald eine Rolle erraten ist"}</span>
        </span>
      </button>
      <button class="kachel" onclick="minispielZiehen(null, false)">
        ${symbol("minispiel")}
        <span class="kachel-titel">Minispiel</span>
        <span class="kachel-text">Eine kurze Herausforderung</span>
      </button>
      <button class="kachel" onclick="zeige('rollen')">
        ${symbol("rollen")}
        <span class="kachel-titel">Rollen</span>
        <span class="kachel-text">Meine Rolle und alle anderen</span>
      </button>
    </div>
  `;
}

// Meine Rolle nochmal ansehen: erst wählen, wer schaut, dann aufdecken
function meineRolleBeginnen() {
  spiel.meine = { wer: null, offen: false };
  zeige("meinerolle");
}

function bildschirmMeineRolle() {
  const m = spiel.meine || { wer: null, offen: false };
  if (m.wer === null || !spiel.spieler[m.wer]) {
    return `
      <div class="kopf"><span class="eyebrow">Geheim</span><h2>Meine Rolle ansehen</h2></div>
      <p class="leise">Wer möchte nachsehen? Danach sieht nur diese Person aufs Handy.</p>
      <div class="auswahl">
        ${spiel.spieler.map((s, i) => `
          <button class="auswahl-knopf" onclick="spiel.meine = { wer: ${i}, offen: false }; zeichnen()">
            <span>${sicher(s.name)}</span><span class="leise">›</span>
          </button>`).join("")}
      </div>`;
  }
  const s = spiel.spieler[m.wer];
  if (!m.offen) {
    return `
      <div class="weitergabe">
        <p class="leise">Gib das Handy an</p>
        <p class="name-gross">${sicher(s.name)}</p>
        <p class="leise">Nur ${sicher(s.name)} darf jetzt hinsehen.</p>
        <button class="knopf" onclick="spiel.meine.offen = true; zeichnen()">Ich bin ${sicher(s.name)}, Rolle zeigen</button>
      </div>`;
  }
  const status = !s.frei
    ? `<span class="chip">noch nicht erraten</span>`
    : s.benutzt
      ? `<span class="chip">erraten</span><span class="chip">Fähigkeit benutzt</span>`
      : `<span class="chip">erraten</span><span class="chip chip-wald">Fähigkeit bereit</span>`;
  return `
    <p class="leise" style="text-align:center">Deine geheime Rolle, ${sicher(s.name)}</p>
    <div class="chips">${status}</div>
    ${rollenkarte(ROLLEN[s.rolle])}
    ${qrAbschnitt(m.wer)}
    <button class="knopf" onclick="spiel.meine = null; zeige('uebersicht')">Karte verbergen und zurück</button>`;
}

// Alle Rollen des Abenteuers, ohne Fähigkeit und Aufgabe
function bildschirmRollen() {
  const erraten = {};
  spiel.spieler.forEach(s => { if (s.frei) erraten[s.rolle] = s.name; });
  const anzahl = spiel.spieler.length;
  return `
    <div class="kopf"><span class="eyebrow">${A().titel}</span><h2>Rollen</h2></div>
    <button class="knopf" onclick="meineRolleBeginnen()">Meine Rolle heimlich ansehen</button>
    <p class="leise">Diese ${maxSpieler()} Rollen gibt es in diesem Abenteuer. ${anzahl < maxSpieler()
      ? `Ihr seid ${anzahl}, also sind nicht alle im Spiel.`
      : "Jede Rolle ist vergeben."} Fähigkeiten und Aufgaben bleiben geheim.</p>
    <div class="rollen-liste">
      ${ROLLEN.map((r, k) => r.geloescht ? "" : `
        <article class="rolle-eintrag">
          <div class="rolle-kopf">
            <span class="kachel-titel">${r.name}, ${r.rolle}</span>
            ${erraten[k] !== undefined ? `<span class="chip chip-gold">erraten: ${sicher(erraten[k])}</span>` : ""}
          </div>
          <ul>${r.merkmale.map(x => `<li>${x}</li>`).join("")}</ul>
        </article>`).join("")}
    </div>`;
}

// Zeigt die gezogene Ereigniskarte mit den passenden Knöpfen darunter
function bildschirmEreignis() {
  const e = spiel.ereignis;
  const karte = e && EREIGNISSE[e.nr];
  if (!karte) return bildschirmUebersicht(); // falls etwas nicht stimmt

  const wirkung = ereignisWirkung();
  const abschnitte = (wirkung.abschnitte || []).map((abschnitt, ai) => {
    const gewaehlt = e.erledigt[ai];
    const knoepfe = abschnitt.knoepfe.map((k, ki) => {
      if (k.minispiel) {
        return `<button class="aktion aktion-spiel" onclick="ereignisAktion(${ai}, ${ki})">Minispiel ziehen: ${KATEGORIEN[k.minispiel]}</button>`;
      }
      if (gewaehlt === ki) {
        return `<button class="aktion gewaehlt" disabled>✓ ${k.text}</button>`;
      }
      return `<button class="aktion" onclick="ereignisAktion(${ai}, ${ki})" ${gewaehlt !== undefined ? "disabled" : ""}>${k.text}</button>`;
    }).join("");
    return `<div class="aktionen-gruppe">${abschnitt.titel ? `<span class="etikett">${abschnitt.titel}</span>` : ""}${knoepfe}</div>`;
  }).join("");

  return `
    ${e.automatisch
      ? `<p class="menue-vorzeile" style="margin:0">Die Zeit ist um! Ein Ereignis tritt ein …</p>`
      : `<p class="leise" style="text-align:center">Ereigniskarte · noch ${spiel.ereignisStapel.length} im Stapel</p>`}
    <article class="rollenkarte zugkarte">
      <div class="titel">
        <span class="etikett">${karte.art}</span>
        <div class="wer">${karte.titel}</div>
      </div>
      <p class="erzaehlung">${karte.text}</p>
    </article>
    ${wirkung.hinweis ? `<p class="hinweis">${wirkung.hinweis}</p>` : ""}
    ${abschnitte ? `<div class="aktionen">${abschnitte}</div>` : ""}
    ${ereignisOffen() ? "" : `<button class="knopf" onclick="zeige('uebersicht')">Weiter</button>`}
  `;
}

// Zeigt ein Minispiel, entweder frei gezogen oder von einer Ereigniskarte ausgelöst
function bildschirmMinispiel() {
  const m = spiel.minispiel;
  const mg = m && MINISPIELE[m.nr];
  if (!mg) return bildschirmUebersicht();

  // Falschspielerin: Ist ihre Rolle erraten und die Fähigkeit noch frei, erscheint hier ein Knopf
  const trickser = spiel.spieler.map((_, i) => i).find(i => ROLLEN[spiel.spieler[i].rolle].faehigkeit.code === "gezinkt"
    && spiel.spieler[i].frei && !spiel.spieler[i].benutzt);
  const gezinkt = m.gezinkt !== undefined
    ? `<p class="hinweis">${name(m.gezinkt)} setzt »Gezinkt« ein und darf den verlorenen Versuch wiederholen.</p>`
    : trickser !== undefined
      ? `<button class="knopf-leise" onclick="gezinktEinsetzen(${trickser})">${name(trickser)}: »Gezinkt« einsetzen und Versuch wiederholen</button>`
      : "";

  const kopf = gezinkt + `
    <p class="leise" style="text-align:center">${m.ausEreignis ? "Ausgelöst durch die Ereigniskarte" : "Minispiel"}</p>
    <article class="rollenkarte zugkarte">
      <div class="titel">
        <span class="etikett">${KATEGORIEN[mg.kategorie]}</span>
        <div class="wer">${mg.titel}</div>
      </div>
      <p class="erzaehlung">${mg.text}</p>
      <p class="muenzen-start">${m.ausEreignis ? "Die Belohnung bestimmt die Ereigniskarte." : belohnungText(mg)}</p>
    </article>`;

  // Von einer Ereigniskarte ausgelöst: dort wird ausgewertet
  if (m.ausEreignis) {
    return kopf + `<button class="knopf" onclick="zeige('ereignis')">Ergebnis eintragen</button>`;
  }

  const abbrechen = ""; // Abbrechen ohne Wertung: Zurück-Pfeil oben links

  // Duell: Zuerst wählt der Herausforderer seinen Gegner
  if (mg.kategorie === "duell" && m.gegner === undefined) {
    return kopf + `
      <div class="aktionen-gruppe">
        <span class="etikett">${name(m.herausforderer)} ${m.durchFaehigkeit ? "" : "hat die wenigsten Münzen und "}fordert heraus. Wen?</span>
        ${spiel.spieler.map((s, i) => i === m.herausforderer ? "" :
          `<button class="aktion" onclick="minispielGegner(${i})">${name(i)}</button>`).join("")}
      </div>
      ${abbrechen}`;
  }

  // Wer spielt mit?
  let wer = "";
  if (mg.kategorie === "duell") wer = `Es treten an: ${name(m.herausforderer)} gegen ${name(m.gegner)}`;
  if (mg.kategorie === "einer") wer = `Der Einzelne ist ${name(m.einzelner)}${m.durchFaehigkeit ? "" : " (die meisten Münzen)"}`;
  if (mg.kategorie === "ungleich") wer = `${mg.einzelName}: ${name(m.riese)} · ${mg.paarName}: ${namen(m.zwerge)}`;
  if (mg.kategorie === "team") wer = `Team 1: ${namen(m.teams[0])}<br>Team 2: ${namen(m.teams[1])}`;
  if (mg.kategorie === "alle" && mg.richter) wer = `Richter: ${name(m.richter)} (die wenigsten Münzen)`;

  return kopf + `
    ${wer ? `<p class="hinweis">${wer}</p>` : ""}
    <div class="aktionen-gruppe">
      <span class="etikett">Wie ist es ausgegangen?</span>
      ${minispielErgebnisse().map((e, k) =>
        `<button class="aktion" onclick="minispielAuswerten(${k})">${e.text}</button>`).join("")}
    </div>
    ${abbrechen}`;
}

// Auf eine Rolle raten: ein Ablauf in mehreren Schritten
function bildschirmRaten() {
  const r = spiel.raten;
  if (!r) return bildschirmUebersicht();
  const rater = r.wer !== null ? spiel.spieler[r.wer] : null;
  const zurueck = `<button class="knopf" onclick="zeige('uebersicht')">Weiter</button>`;

  // Schritt 1: Wer möchte raten?
  if (r.schritt === "wer") {
    return `
      <h2>Auf eine Rolle raten</h2>
      <p class="leise">Wer möchte raten? ${spiel.ratenGratis ? "Lose Zungen: Raten kostet gerade nichts." : "Ein Tipp kostet 1 Münze."} Schon erratene Rollen können nicht noch einmal erraten werden.</p>
      <div class="auswahl">
        ${spiel.spieler.map((s, i) => `
          <button class="auswahl-knopf" onclick="ratenWer(${i})" ${kannRaten(i) ? "" : "disabled"}>
            <span>${sicher(s.name)}</span>
            <span class="leise">${s.muenzen < ratenKosten() ? "keine Münzen" : !nochZuErraten(i) ? "alle anderen erraten" : s.muenzen + " Münzen"}</span>
          </button>`).join("")}
      </div>`;
  }

  // Schritt 2: Münze setzen?
  if (r.schritt === "setzen") {
    return `
      ${spiel.ratenGratis ? `
      <h2>${sicher(rater.name)}, möchtest du auf eine Rolle raten?</h2>
      <p class="leise">Lose Zungen: Dein Tipp kostet gerade nichts.</p>
      <button class="knopf" onclick="ratenSetzen()">Ja, Tipp abgeben</button>` : `
      <h2>${sicher(rater.name)}, eine Münze setzen, um auf eine Rolle zu raten?</h2>
      <p class="leise">Du hast ${rater.muenzen} Münzen. Die gesetzte Münze geht an die Spielbank.</p>
      <button class="knopf" onclick="ratenSetzen()">Ja, 1 Münze setzen</button>`}
`;
  }

  // Schritt 3: Richtig oder falsch?
  if (r.schritt === "ergebnis") {
    return `
      <h2>${r.gratis ? "Dein Tipp, bitte!" : "Die Münze ist gesetzt"}</h2>
      <p class="erzaehlung">${sicher(rater.name)}, sprich deinen Tipp laut aus: Wer ist welche Rolle? Die Person, auf die getippt wurde, sagt ehrlich, ob es stimmt.</p>
      <button class="knopf" onclick="ratenErgebnis(true)">Rolle richtig erraten</button>
      <button class="knopf-leise" onclick="ratenErgebnis(false)">Falsch geraten</button>`;
  }

  // Schritt 4a: Falsch geraten
  if (r.schritt === "falsch") {
    return `
      <h2>Daneben!</h2>
      <p class="erzaehlung">Die anderen haben ihr Geheimnis gewahrt. ${r.gratis ? "Zum Glück hat dich der Tipp nichts gekostet." : "Die gesetzte Münze ist verloren."}</p>
      <p class="leise">${sicher(rater.name)} hat jetzt ${rater.muenzen} Münzen.</p>
      ${zurueck}`;
  }

  // Schritt 4b: Richtig, aber wessen Rolle?
  if (r.schritt === "wen") {
    return `
      <h2>Wessen Rolle hat ${sicher(rater.name)} erraten?</h2>
      <div class="auswahl">
        ${spiel.spieler.map((s, i) => i === r.wer ? "" : `
          <button class="auswahl-knopf" onclick="ratenWen(${i})" ${s.frei ? "disabled" : ""}>
            <span>${sicher(s.name)}</span>
            <span class="leise">${s.frei ? "schon erraten" : ""}</span>
          </button>`).join("")}
      </div>`;
  }

  // Schritt 5: Treffer!
  const erraten = spiel.spieler[r.wen];
  return `
    <h2>Treffer!</h2>
    <p class="ergebnis-zahl">+${r.bonus || 3} Münzen</p>
    <p class="erzaehlung">${sicher(rater.name)} hat die Rolle von ${sicher(erraten.name)} durchschaut. Die Fähigkeit von ${sicher(erraten.name)} ist jetzt freigeschaltet.</p>
    <p class="leise">${sicher(rater.name)} hat jetzt ${rater.muenzen} Münzen.</p>
    ${zurueck}`;
}

// Besondere Fähigkeit einsetzen
function bildschirmFaehigkeit() {
  const f = spiel.faehigkeit;
  if (!f) return bildschirmUebersicht();
  const abbrechen = ""; // Abbrechen: Zurück-Pfeil oben links

  // Schritt 1: Wer setzt seine Fähigkeit ein?
  if (f.schritt === "wer") {
    const bereit = spiel.spieler.map((_, i) => i).filter(i => spiel.spieler[i].frei && !spiel.spieler[i].benutzt);
    return `
      <h2>Besondere Fähigkeit einsetzen</h2>
      <p class="leise">Wessen Rolle erraten wurde, darf seine Fähigkeit einmal pro Partie einsetzen.</p>
      ${bereit.length
        ? `<div class="auswahl">${bereit.map(i => `
            <button class="auswahl-knopf" onclick="faehigkeitWer(${i})">
              <span>${name(i)}</span>
              <span class="leise">${ROLLEN[spiel.spieler[i].rolle].faehigkeit.name}</span>
            </button>`).join("")}</div>`
        : `<p class="hinweis">Im Moment kann niemand eine Fähigkeit einsetzen. Zuerst muss eine Rolle erraten werden.</p>`}`;
  }

  // Schritt 2: Die Fähigkeit anzeigen und auslösen
  const i = f.wer;
  const rolle = ROLLEN[spiel.spieler[i].rolle];
  const fa = rolle.faehigkeit;
  const kopf = `
    <p class="leise" style="text-align:center">${name(i)} als ${rolle.name}, ${rolle.rolle}</p>
    <article class="rollenkarte zugkarte">
      <div class="titel">
        <span class="etikett">Besondere Fähigkeit</span>
        <div class="wer">${fa.name}</div>
      </div>
      <p class="erzaehlung">${fa.text}</p>
    </article>`;
  const knopf = (text, aktion) => `<button class="aktion" onclick="${aktion}">${text}</button>`;
  const muenzWort = n => n === 1 ? "Münze" : "Münzen";

  switch (fa.code) {
    case "schatzsucher":
      return kopf + knopf(`${name(i)} erhält 3 Münzen`, "faehigkeitTun()") + abbrechen;

    case "gluecksbringerin": {
      const v = verlustDurchEreignis(i);
      if (v > 0) return kopf + knopf(`Verlust aufheben: ${name(i)} erhält ${v} ${muenzWort(v)} zurück`, "faehigkeitTun()") + abbrechen;
      return kopf + `<p class="hinweis">Gerade droht ${name(i)} kein Verlust. Die Fähigkeit wirkt direkt, nachdem ${name(i)} durch ein Ereignis Münzen verloren hat.</p>` + abbrechen;
    }

    case "goldfinger": {
      const extra = Math.min((spiel.letzteGewinne || {})[i] || 0, 3);
      if (extra > 0) return kopf + knopf(`${name(i)} erhält ${extra} zusätzliche ${muenzWort(extra)}`, "faehigkeitTun()") + abbrechen;
      return kopf + `<p class="hinweis">${name(i)} hat das letzte Minispiel nicht gewonnen. Die Fähigkeit wirkt direkt nach einem gewonnenen Minispiel.</p>` + abbrechen;
    }

    case "praezisionsmeister":
      return kopf + `
        <div class="aktionen-gruppe">
          <span class="etikett">${name(i)} kündigt den Sieg an. Welches Minispiel?</span>
          ${knopf(`Duell: ${name(i)} fordert heraus`, "praezisionStarten('duell')")}
          ${knopf("Alle gegen alle", "praezisionStarten('alle')")}
          ${knopf(`Einer gegen alle: ${name(i)} allein`, "praezisionStarten('einer')")}
        </div>` + abbrechen;

    case "pfadfinderin":
      if (f.schritt !== "ansehen") {
        return kopf + `<p class="hinweis">Nur ${name(i)} schaut jetzt aufs Handy.</p>`
          + knopf("Nächste Ereigniskarte ansehen", "faehigkeitAnsehen()") + abbrechen;
      }
      return ereignisVorschau(naechsteEreignisse(1)[0]) + `
        <div class="aktionen-gruppe">
          ${knopf("Diese Karte jetzt spielen", "pfadfinderin(true)")}
          ${knopf("Unter den Stapel legen", "pfadfinderin(false)")}
        </div>`;

    case "schicksalswender": {
      if (f.schritt !== "ansehen") {
        return kopf + `<p class="hinweis">Nur ${name(i)} schaut jetzt aufs Handy.</p>`
          + knopf("Zwei Ereigniskarten ziehen", "faehigkeitAnsehen()") + abbrechen;
      }
      const [a, b] = naechsteEreignisse(2);
      return `<p class="leise" style="text-align:center">Welche Karte soll gespielt werden? Die andere kommt unter den Stapel.</p>`
        + ereignisVorschau(a) + knopf("Diese Karte spielen", `schicksal(${a}, ${b})`)
        + ereignisVorschau(b) + knopf("Diese Karte spielen", `schicksal(${b}, ${a})`);
    }

    case "hausrecht":
      if (f.schritt !== "ansehen") {
        return kopf + `<p class="hinweis">Nur ${name(i)} schaut jetzt aufs Handy.</p>`
          + knopf("Nächste Ereigniskarte ansehen", "faehigkeitAnsehen()") + abbrechen;
      }
      return ereignisVorschau(naechsteEreignisse(1)[0]) + `
        <div class="aktionen-gruppe">
          ${knopf(`Jetzt spielen, ${name(i)} erhält 1 Münze`, "hausrecht(true)")}
          ${knopf("Ablegen, unter den Stapel", "hausrecht(false)")}
        </div>`;

    case "trinkgeld":
      if ((spiel.letzteTeilnehmer || []).includes(i)) {
        return kopf + knopf(`${name(i)} erhält 2 Münzen Trinkgeld`, "faehigkeitTun()") + abbrechen;
      }
      return kopf + `<p class="hinweis">Die Fähigkeit wirkt direkt nach einem Minispiel, bei dem ${name(i)} mitgespielt hat.</p>` + abbrechen;

    case "narr":
      if (f.belohnung) {
        return kopf + `
          <p class="ergebnis-zahl">+${f.belohnung} ${muenzWort(f.belohnung)}</p>
          <button class="knopf" onclick="zeige('uebersicht')">Weiter</button>`;
      }
      return kopf + knopf("Belohnung ziehen", "narr()") + abbrechen;

    case "suppe": {
      if (verlustDurchEreignis(i) > 0) return kopf + knopf(`${name(i)} erhält 3 Münzen`, "faehigkeitTun()") + abbrechen;
      return kopf + `<p class="hinweis">Gerade hat ${name(i)} durch kein Ereignis Münzen verloren. Die Fähigkeit wirkt direkt nach so einem Verlust.</p>` + abbrechen;
    }

    case "zugabe":
      return kopf + `
        <div class="aktionen-gruppe">
          <span class="etikett">Welches Minispiel spielt ${name(i)}?</span>
          ${(f.optionen || []).map(nr => knopf(`${MINISPIELE[nr].titel} · ${KATEGORIEN[MINISPIELE[nr].kategorie]}`, `zugabe(${nr})`)).join("")}
        </div>` + abbrechen;

    case "gezinkt":
      return kopf + `<p class="hinweis">Diese Fähigkeit setzt ${name(i)} während eines Minispiels ein. Dort erscheint dann ein Knopf dafür.</p>` + abbrechen;

    case "zukunft": {
      if (f.schritt !== "ansehen") {
        return kopf + `<p class="hinweis">Nur ${name(i)} schaut jetzt aufs Handy.</p>`
          + knopf("Zwei Ereigniskarten ansehen", "faehigkeitAnsehen()") + abbrechen;
      }
      const [a, b] = naechsteEreignisse(2);
      return `<p class="leise" style="text-align:center">Welche Karte soll als Nächstes kommen? Die andere folgt danach.</p>`
        + ereignisVorschau(a) + knopf("Diese Karte kommt als Nächstes", `zukunft(${a}, ${b})`)
        + ereignisVorschau(b) + knopf("Diese Karte kommt als Nächstes", `zukunft(${b}, ${a})`);
    }

    case "herausforderung":
      return kopf + knopf(`${name(i)} fordert zum Duell`, "herausforderung()") + abbrechen;

    case "gluecksfee":
      if (f.wurf) {
        return kopf + `
          <div class="muenzwurf">${f.wurf}</div>
          <p class="ergebnis-zahl">${f.gewonnen ? "+4 Münzen" : "Leider nichts"}</p>
          <p class="erzaehlung" style="text-align:center">${name(i)} hat auf ${f.seite} gesetzt, die Münze zeigt ${f.wurf}.</p>
          <button class="knopf" onclick="zeige('uebersicht')">Weiter</button>`;
      }
      return kopf + `
        <div class="aktionen-gruppe">
          <span class="etikett">Welche Seite bedeutet Erfolg?</span>
          ${knopf("Kopf", "gluecksfee('Kopf')")}
          ${knopf("Zahl", "gluecksfee('Zahl')")}
        </div>` + abbrechen;
  }
  // Fähigkeit ohne Spielmechanik: Münzen bucht ihr von Hand in der Münzkasse
  return kopf + `<p class="hinweis">Für diese Fähigkeit rechnet die App nichts aus. Münzen bucht ihr bei Bedarf von Hand über den Geldbeutel.</p>`
    + knopf("Fähigkeit wurde eingesetzt", "faehigkeitTun()") + abbrechen;
}

// Eine Ereigniskarte als Vorschau (für Pfadfinderin und Schicksalswender)
function ereignisVorschau(nr) {
  const karte = EREIGNISSE[nr];
  return `
    <article class="rollenkarte zugkarte">
      <div class="titel">
        <span class="etikett">${karte.art}</span>
        <div class="wer">${karte.titel}</div>
      </div>
      <p class="erzaehlung">${karte.text}</p>
    </article>`;
}

function bildschirmSpiel() {
  const liste = spiel.spieler.map((s, i) => `
    <div class="spieler">
      <span class="name">${sicher(s.name)}</span>
      <div class="zaehler">
        <button aria-label="Eine Münze weniger für ${sicher(s.name)}" onclick="muenzen(${i}, -1)">−</button>
        <span class="stand">${s.muenzen}</span>
        <button aria-label="Eine Münze mehr für ${sicher(s.name)}" onclick="muenzen(${i}, 1)">+</button>
      </div>
      <div class="faehigkeit">
        ${!s.frei ? `<span class="chip">noch nicht erraten</span>`
          : s.benutzt ? `<span class="chip">erraten</span><span class="chip">Fähigkeit benutzt</span>`
          : `<span class="chip">erraten</span><span class="chip chip-wald">Fähigkeit bereit</span>`}
      </div>
    </div>`).join("");

  const korrektur = spiel.spieler.map((s, i) => `
    <div class="korrektur-zeile">
      <strong>${sicher(s.name)}</strong>
      <label><input type="checkbox" id="frei-${i}" ${s.frei ? "checked" : ""}
             onchange="spiel.spieler[${i}].frei = this.checked; speichern(); zeichnen()"> Rolle erraten</label>
      <label><input type="checkbox" id="benutzt-${i}" ${s.benutzt ? "checked" : ""}
             onchange="spiel.spieler[${i}].benutzt = this.checked; speichern(); zeichnen()"> Fähigkeit benutzt</label>
    </div>`).join("");

  return `
    <h2>Münzen von Hand ändern</h2>
    <p class="leise">Die App bucht Münzen selbst. Hier korrigiert ihr, falls etwas nicht stimmt.</p>
    <div class="spielerliste">${liste}</div>
    <details class="korrektur" ${korrekturOffen ? "open" : ""} ontoggle="korrekturOffen = this.open">
      <summary>Status von Hand korrigieren</summary>
      ${korrektur}
    </details>
  `;
}

function bildschirmAufgaben() {
  const liste = spiel.spieler.map((s, i) => {
    const r = ROLLEN[s.rolle];
    return `
      <label class="aufgabe-check">
        <input type="checkbox" id="aufgabe-${i}" ${s.aufgabeErfuellt ? "checked" : ""}
               onchange="spiel.spieler[${i}].aufgabeErfuellt = this.checked; speichern()">
        <span><strong>${sicher(s.name)}</strong> als ${r.name}, ${r.rolle}<br>
        <span class="leise">${r.aufgabe.name}: ${r.aufgabe.text} (+${r.aufgabe.bonus})</span></span>
      </label>`;
  }).join("");

  return `
    <h2>Die geheimen Aufgaben</h2>
    <p class="leise">Jetzt werden alle Rollen enthüllt. Hakt ab, wer seine Aufgabe nachweisen kann.</p>
    <div>${liste}</div>
    <button class="knopf" onclick="zeige('ende')">Münzen zählen</button>
  `;
}

function bildschirmEnde() {
  // Endstand = Münzen + Bonus für erfüllte Aufgabe
  const ergebnis = spiel.spieler.map(s => ({
    name: s.name,
    gesamt: s.muenzen + (s.aufgabeErfuellt ? ROLLEN[s.rolle].aufgabe.bonus : 0)
  })).sort((a, b) => b.gesamt - a.gesamt);

  const bester = ergebnis[0].gesamt;
  const sieger = ergebnis.filter(e => e.gesamt === bester).map(e => sicher(e.name));
  const siegerText = sieger.join(" & ");

  return `
    ${A().abschluss(siegerText, sieger.length > 1)}
    ${sieger.length > 1 ? `<p class="leise" style="text-align:center">Gleichstand! Die Regel dafür legt ihr noch fest.</p>` : ""}
    <div class="rangliste">
      ${ergebnis.map(e => `<div><span>${sicher(e.name)}</span><strong>${e.gesamt} Münzen</strong></div>`).join("")}
    </div>
    <button class="knopf" onclick="nochmal()">Nochmal mit derselben Runde</button>
    <button class="knopf-leise" onclick="neuesSpiel()">Zum Hauptmenü</button>
  `;
}

/* -----------------------------------------------------------------
   E) AKTIONEN: was passiert, wenn man auf Knöpfe drückt
   ----------------------------------------------------------------- */

function nameHinzufuegen() {
  spiel.namen.push("");
  zeichnen();
  document.getElementById("name-" + (spiel.namen.length - 1)).focus();
}

// Eingabetaste: zum nächsten Namen springen oder einen neuen anlegen
function nameTaste(ereignis, i) {
  if (ereignis.key !== "Enter") return;
  ereignis.preventDefault();
  const naechstes = document.getElementById("name-" + (i + 1));
  if (naechstes) naechstes.focus();
  else if (spiel.namen.length < maxSpieler()) nameHinzufuegen();
  else ereignis.target.blur();
}

function nameEntfernen(i) {
  spiel.namen.splice(i, 1);
  zeichnen();
}

// Prüft, ob alle Namen ausgefüllt und verschieden sind.
function pruefeNamen() {
  const namen = spiel.namen.map(n => n.trim());
  let fehler = "";
  if (namen.some(n => n === "")) fehler = `Bitte gib allen ${A().dativ} einen Namen.`;
  else if (new Set(namen.map(n => n.toLowerCase())).size !== namen.length) fehler = `Zwei ${A().mehrzahl} haben denselben Namen.`;
  document.getElementById("hinweis").textContent = fehler;
  document.getElementById("verteilen").disabled = fehler !== "";
  return fehler === "";
}

function rollenVerteilen() {
  if (!pruefeNamen()) return;
  // Rollennummern 0–6 mischen und jedem Spieler eine geben
  tischAufraeumen(); // Seiten der letzten Partie leeren
  // Neue Partie: gelöschte Einträge vergessen und die Reihenfolge frisch festlegen
  spiel.spieler = [];
  spiel.reihenfolge = null;
  if (letzterInhalt) inhaltAnwenden(letzterInhalt, inhaltQuelle);
  abenteuerSetzen(spiel.abenteuer);
  const gemischt = mischen(aktive(ROLLEN));
  spiel.spieler = spiel.namen.map((name, i) => ({
    name: name.trim(),
    rolle: gemischt[i],
    muenzen: ROLLEN[gemischt[i]].start,
    frei: false, benutzt: false, aufgabeErfuellt: false,
    zugang: zufallsCode()   // geheimer Teil der Adresse im QR-Code
  }));
  reihenfolgeMerken();
  spiel.aktuell = 0;
  spiel.aufgedeckt = false;
  spiel.ereignisStapel = []; // jede Partie mit frisch gemischtem Stapel
  spiel.seherBonus = false;
  spiel.siegBonus = null;
  spiel.ratenGratis = false;
  spiel.letzteGewinne = {};
  spiel.letzteTeilnehmer = [];
  zeige("weitergabe");
}

function naechsterSpieler() {
  spiel.aufgedeckt = false;
  if (spiel.aktuell < spiel.spieler.length - 1) {
    spiel.aktuell++;
    zeige("weitergabe");
  } else {
    zeige("einfuehrung");
  }
}

function muenzen(i, aenderung) {
  const s = spiel.spieler[i];
  s.muenzen = Math.max(0, s.muenzen + aenderung); // nie unter 0
  speichern();
  zeichnen();
}

// Öffnet das Regelwerk (der Zurück-Pfeil führt dorthin, wo man herkam)
function regelnOeffnen() {
  oeffne("regeln");
}

/* --- Ereigniskarten ---
   Die Karten liegen in einem gemischten Stapel. Ist er leer, wird neu gemischt.
   So kommt jede Karte erst wieder, wenn alle anderen dran waren. */
function ereignisZiehen(automatisch, festeNr) {
  if (festeNr === undefined && (!spiel.ereignisStapel || spiel.ereignisStapel.length === 0)) {
    spiel.ereignisStapel = mischen(aktive(EREIGNISSE));
  }
  let nr = festeNr !== undefined ? festeNr : spiel.ereignisStapel.pop();
  if (!EREIGNISSE[nr] || (festeNr === undefined && EREIGNISSE[nr].geloescht)) { // Stapel veraltet: neu mischen
    spiel.ereignisStapel = mischen(aktive(EREIGNISSE));
    nr = spiel.ereignisStapel.pop();
  }

  // Der Zeitgeber stoppt. Er startet neu, sobald ihr zur Übersicht zurückkehrt.
  spiel.timerEnde = null;
  // Eine neue Karte beendet die "Nacht der Seher"
  spiel.seherBonus = EREIGNISSE[nr].wirkung === "seher";
  spiel.ratenGratis = EREIGNISSE[nr].wirkung === "losezungen";
  // Ein neues Ereignis beendet die Gelegenheit für Goldfinger und Trinkgeld
  spiel.letzteGewinne = {};
  spiel.letzteTeilnehmer = [];

  spiel.ereignis = {
    nr: nr,
    automatisch: Boolean(automatisch),
    erledigt: {},          // welche Knöpfe schon gedrückt wurden
    minispielNr: null,     // welches Minispiel die Karte ausgelöst hat
    betroffen: schnappschuss()
  };
  zeige("ereignis");
}

// Merkt sich beim Ziehen, wer gerade die meisten/wenigsten Münzen hat usw.
// So ändern sich die Knöpfe nicht, während ihr Münzen verteilt.
function schnappschuss() {
  const muenzen = spiel.spieler.map(s => s.muenzen);
  const max = Math.max(...muenzen);
  const min = Math.min(...muenzen);
  const alle = spiel.spieler.map((_, i) => i);
  return {
    meiste: alle.filter(i => muenzen[i] === max),
    wenigste: alle.filter(i => muenzen[i] === min),
    erraten: alle.filter(i => spiel.spieler[i].frei),
    unerraten: alle.filter(i => !spiel.spieler[i].frei)
  };
}

// Hilfen für die Knopftexte
function name(i) { return sicher(spiel.spieler[i].name); }
function namen(liste) {
  const n = liste.map(name);
  return n.length <= 1 ? n.join("") : n.slice(0, -1).join(", ") + " und " + n[n.length - 1];
}
function verb(liste, einzahl, mehrzahl) { return liste.length === 1 ? einzahl : mehrzahl; }

// Gibt (oder nimmt bei negativer Zahl) jedem Spieler aus der Liste Münzen
function plus(liste, betrag) {
  liste.forEach(i => { spiel.spieler[i].muenzen = Math.max(0, spiel.spieler[i].muenzen + betrag); });
}

// Jeder Verlierer gibt dem Sieger bis zu 2 Münzen
function duellGewinn(sieger, teilnehmer) {
  teilnehmer.forEach(i => {
    if (i === sieger) return;
    const abgabe = Math.min(2, spiel.spieler[i].muenzen);
    spiel.spieler[i].muenzen -= abgabe;
    spiel.spieler[sieger].muenzen += abgabe;
  });
}

// Hier steht für jede Wirkung, welche Knöpfe die Karte bekommt.
// Ein Abschnitt ist eine Gruppe von Knöpfen, von denen man EINEN drückt.
function ereignisWirkung() {
  const e = spiel.ereignis;
  const b = e.betroffen;
  const alle = spiel.spieler.map((_, i) => i);
  const alleGleich = b.meiste.length === alle.length;
  const siegerWahl = (liste, betrag) => ({
    titel: "Wer hat gewonnen?",
    knoepfe: liste.map(i => ({ text: `${name(i)} (+${betrag})`, tun: () => plus([i], betrag), gewinner: [i] }))
  });

  switch (EREIGNISSE[e.nr].wirkung) {
    case "goldregen":
      return { abschnitte: [{ knoepfe: [{ text: "Alle erhalten 1 Münze", tun: () => plus(alle, 1) }] }] };

    case "steuer":
      return { abschnitte: [{ knoepfe: [{ text: "Alle zahlen 1 Münze", tun: () => plus(alle, -1) }] }] };

    case "gunst":
      return { abschnitte: [{ knoepfe: [{
        text: `${namen(b.wenigste)} ${verb(b.wenigste, "erhält", "erhalten je")} 3 Münzen`,
        tun: () => plus(b.wenigste, 3) }] }] };

    case "neid":
      if (alleGleich) return { hinweis: "Alle haben gleich viele Münzen. Nichts geschieht." };
      return { abschnitte: [{ knoepfe: [{
        text: `${namen(b.meiste)} ${verb(b.meiste, "gibt", "geben je")} 2 Münzen an ${namen(b.wenigste)}`,
        tun: () => { plus(b.meiste, -2); plus(b.wenigste, 2); } }] }] };

    case "entlarvt":
      if (!b.erraten.length) return { hinweis: "Noch wurde niemand entlarvt. Nichts geschieht." };
      return { abschnitte: [{ knoepfe: [{
        text: `${namen(b.erraten)} ${verb(b.erraten, "verliert", "verlieren je")} 1 Münze`,
        tun: () => plus(b.erraten, -1) }] }] };

    case "tarnung":
      if (!b.unerraten.length) return { hinweis: "Alle Rollen sind schon erraten. Nichts geschieht." };
      return { abschnitte: [{ knoepfe: [{
        text: `${namen(b.unerraten)} ${verb(b.unerraten, "erhält", "erhalten je")} 1 Münze`,
        tun: () => plus(b.unerraten, 1) }] }] };

    case "duell": {
      const teilnehmer = alle.filter(i => b.meiste.includes(i) || b.wenigste.includes(i));
      const art = teilnehmer.length === 2 ? "duell" : "alle";
      return {
        hinweis: `Es treten an: ${namen(teilnehmer)}`,
        abschnitte: [
          { knoepfe: [{ minispiel: art }] },
          { titel: "Wer hat gewonnen?", knoepfe: teilnehmer.map(i => ({
              text: `${name(i)} gewinnt und erhält von ${verb(teilnehmer.slice(1), "dem Verlierer", "jedem Verlierer")} 2 Münzen`,
              tun: () => duellGewinn(i, teilnehmer), gewinner: [i], teilnehmer: teilnehmer })) }
        ]
      };
    }

    case "kraeftemessen": {
      const belohnung = e.minispielNr !== null ? MINISPIELE[e.minispielNr].sieger * 2 : 4;
      return { abschnitte: [{ knoepfe: [{ minispiel: "alle" }] }, siegerWahl(alle, belohnung)] };
    }

    case "lager":
      if (b.erraten.length && b.unerraten.length) {
        return { abschnitte: [
          { knoepfe: [{ minispiel: "team" }] },
          { titel: "Welches Team hat gewonnen?", knoepfe: [
            { text: `Die Entdeckten: ${namen(b.erraten)} (je +1)`, tun: () => plus(b.erraten, 1), gewinner: b.erraten },
            { text: `Die Unentdeckten: ${namen(b.unerraten)} (je +1)`, tun: () => plus(b.unerraten, 1), gewinner: b.unerraten }
          ] }
        ] };
      }
      return {
        hinweis: "Es gibt nur ein Lager. Darum heißt es: alle gegen alle!",
        abschnitte: [{ knoepfe: [{ minispiel: "alle" }] }, siegerWahl(alle, 2)]
      };

    case "beutel":
      return { abschnitte: [
        { knoepfe: [{ minispiel: "duell" }] },
        ...b.meiste.map(i => ({ titel: `${name(i)}`, knoepfe: [
          { text: `${name(i)} gewinnt das Duell und behält alles`, tun: () => {}, gewinner: [i] },
          { text: `${name(i)} verliert 2 Münzen`, tun: () => plus([i], -2), gewinner: [] }
        ] }))
      ] };

    case "orakel":
      return { abschnitte: b.meiste.map(i => ({ titel: `${name(i)}`, knoepfe: [
        { text: `${name(i)} verrät ein Merkmal`, tun: () => {} },
        { text: `${name(i)} schweigt und zahlt 2 Münzen`, tun: () => plus([i], -2) }
      ] })) };

    case "scheideweg":
      return { abschnitte: [{
        titel: `${namen(b.wenigste)} ${verb(b.wenigste, "entscheidet", "entscheiden gemeinsam")}`,
        knoepfe: [
          { text: "Alle erhalten 1 Münze", tun: () => plus(alle, 1) },
          { text: `${namen(b.wenigste)} ${verb(b.wenigste, "erhält", "erhalten je")} 2 Münzen`, tun: () => plus(b.wenigste, 2) }
        ] }] };

    case "taschendieb":
      return { abschnitte: [{ knoepfe: [{
        text: `${namen(b.meiste)} ${verb(b.meiste, "verliert", "verlieren je")} 2 Münzen`,
        tun: () => plus(b.meiste, -2) }] }] };

    case "fremder": {
      if (alleGleich) return { hinweis: "Alle haben gleich viele Münzen. Der Fremde findet keinen würdigen Gegner und trinkt still sein Bier. Nichts geschieht." };
      const gruppe = alle.filter(i => !b.meiste.includes(i));
      return {
        hinweis: `Allein gegen alle: ${namen(b.meiste)}`,
        abschnitte: [
          { knoepfe: [{ minispiel: "einer" }] },
          { titel: "Wer hat gewonnen?", knoepfe: [
            { text: `${namen(b.meiste)} ${verb(b.meiste, "gewinnt (+3)", "gewinnen (je +3)")}`,
              tun: () => plus(b.meiste, 3), gewinner: b.meiste },
            { text: "Die Gruppe gewinnt (je +1)", tun: () => plus(gruppe, 1), gewinner: gruppe }
          ] }
        ]
      };
    }

    case "grosszuegig":
      return { abschnitte: b.meiste.map(i => ({ titel: `${name(i)} entscheidet`, knoepfe: [
        ...alle.filter(j => j !== i).map(j => ({ text: `${name(i)} schenkt ${name(j)} 2 Münzen`, tun: () => uebertragen(i, j, 2) })),
        { text: `${name(i)} zahlt 3 Münzen an die Spielbank`, tun: () => plus([i], -3) }
      ] })) };

    case "schicksal":
      if (e.wuerfe) {
        return { hinweis: e.wuerfe.map((w, i) => `${name(i)}: ${w} (${w === "Kopf" ? "+1" : "−1"})`).join("<br>") };
      }
      return { abschnitte: [{ knoepfe: [{ text: "Münzen für alle werfen", bleiben: true, tun: () => {
        e.wuerfe = alle.map(() => Math.random() < 0.5 ? "Kopf" : "Zahl");
        e.wuerfe.forEach((w, i) => plus([i], w === "Kopf" ? 1 : -1));
      } }] }] };

    case "losezungen":
      return { hinweis: "Die App hat es sich gemerkt: Bis zum nächsten Ereignis kostet Raten keine Münze." };

    case "seher":
      return { hinweis: "Die App hat es sich gemerkt: Bis zum nächsten Ereignis bringt ein Treffer beim Raten 5 Münzen." };

    default: // Ruhekarten
      return {};
  }
}

// Wird aufgerufen, wenn ein Knopf unter der Ereigniskarte gedrückt wird
function ereignisAktion(ai, ki) {
  const e = spiel.ereignis;
  const knopf = ereignisWirkung().abschnitte[ai].knoepfe[ki];
  if (knopf.minispiel) { minispielZiehen(knopf.minispiel, true); return; }
  if (e.erledigt[ai] !== undefined) return; // schon erledigt
  const vorher = spiel.spieler.map(s => s.muenzen);
  if (knopf.tun) knopf.tun();
  // Verluste durch dieses Ereignis merken (für die Glücksbringerin)
  e.verlust = e.verlust || {};
  spiel.spieler.forEach((s, i) => {
    const differenz = s.muenzen - vorher[i];
    if (differenz < 0) e.verlust[i] = (e.verlust[i] || 0) - differenz;
  });
  // War das das Ergebnis eines Minispiels? (für Goldfinger und Präzisionsmeister)
  if (knopf.gewinner) minispielBeendet(knopf.gewinner, vorher, knopf.teilnehmer);
  e.erledigt[ai] = ki;

  // Manche Karten zeigen nach dem Knopfdruck noch ein Ergebnis an
  if (knopf.bleiben) { speichern(); zeichnen(); return; }

  // Alles erledigt? Dann direkt zurück zur Übersicht.
  if (!ereignisOffen()) {
    zeige("uebersicht");
  } else {
    speichern();
    zeichnen();
  }
}

// Gibt es unter der Ereigniskarte noch Knöpfe, die gedrückt werden müssen?
function ereignisOffen() {
  const e = spiel.ereignis;
  return (ereignisWirkung().abschnitte || []).some((a, i) =>
    a.knoepfe.some(k => !k.minispiel) && e.erledigt[i] === undefined);
}

/* --- Minispiele ---
   kategorie: nur Minispiele dieser Art ziehen (oder null für alle).
   ausEreignis: true, wenn eine Ereigniskarte das Minispiel ausgelöst hat. */
// mitspieler: Wer durch eine Fähigkeit selbst herausfordert oder der Einzelne ist (sonst leer)
function minispielZiehen(kategorie, ausEreignis, mitspieler) {
  let auswahl = aktive(MINISPIELE).filter(i => !kategorie || MINISPIELE[i].kategorie === kategorie);
  // Nicht zweimal hintereinander dasselbe Minispiel
  if (auswahl.length > 1 && spiel.minispiel) auswahl = auswahl.filter(i => i !== spiel.minispiel.nr);
  const nr = auswahl[Math.floor(Math.random() * auswahl.length)];
  minispielStarten(nr, ausEreignis, mitspieler);
}

// Startet ein bestimmtes Minispiel (gezogen oder vom Spielmann ausgewählt)
function minispielStarten(nr, ausEreignis, mitspieler) {
  const mg = MINISPIELE[nr];
  const m = { nr: nr, ausEreignis: Boolean(ausEreignis) };

  // Frei gezogen: Die App legt fest, wer mitspielt
  if (!ausEreignis) {
    const reihe = nachMuenzen(); // wenigste Münzen zuerst, meiste zuletzt
    const durchFaehigkeit = mitspieler !== undefined;
    if (mg.kategorie === "duell") m.herausforderer = durchFaehigkeit ? mitspieler : reihe[0];
    if (mg.kategorie === "einer") m.einzelner = durchFaehigkeit ? mitspieler : reihe[reihe.length - 1];
    if (mg.kategorie === "ungleich") {
      m.riese = durchFaehigkeit ? mitspieler : reihe[reihe.length - 1];
      m.zwerge = reihe.filter(i => i !== m.riese).slice(0, 2);
    }
    if (mg.kategorie === "alle" && mg.richter) m.richter = reihe.find(i => i !== mitspieler);
    m.durchFaehigkeit = durchFaehigkeit;
    if (mg.kategorie === "team") {
      const gemischt = mischen(spiel.spieler.map((_, i) => i));
      const haelfte = Math.ceil(gemischt.length / 2);
      m.teams = [gemischt.slice(0, haelfte), gemischt.slice(haelfte)];
    }
  }

  spiel.minispiel = m;
  if (ausEreignis) spiel.ereignis.minispielNr = nr;
  zeige("minispiel");
}

// Alle Spieler, sortiert nach Münzen (wenigste zuerst). Bei Gleichstand entscheidet der Zufall.
function nachMuenzen() {
  return mischen(spiel.spieler.map((_, i) => i))
    .sort((a, b) => spiel.spieler[a].muenzen - spiel.spieler[b].muenzen);
}

// Macht aus 2 ein "+2" und aus -1 ein "−1"
function vorzeichen(n) { return (n > 0 ? "+" : "−") + Math.abs(n); }

// Die Belohnungszeile auf der Minispielkarte
function belohnungText(mg) {
  switch (mg.kategorie) {
    case "duell": return `Sieger: ${vorzeichen(mg.sieger)}` + (mg.verlierer ? ` · Verlierer: ${vorzeichen(mg.verlierer)}` : "");
    case "alle": return `Sieger: ${vorzeichen(mg.sieger)}` + (mg.richter ? ` · Richter: ${vorzeichen(mg.richter)}` : "");
    case "einer": return `Einzelner gewinnt: ${vorzeichen(mg.einzeln)}`
      + (mg.gruppe ? ` · Gruppe gewinnt: je ${vorzeichen(mg.gruppe)}` : "")
      + (mg.scheitern ? ` · Scheitert er: ${vorzeichen(mg.scheitern)}` : "");
    case "team": return `Siegerteam: je ${vorzeichen(mg.team)}`;
    case "ungleich": return `${mg.einzelName} gewinnt: ${vorzeichen(mg.riese)} · ${mg.paarName} gewinnen: je ${vorzeichen(mg.zwerge)}`;
  }
  return "";
}

// Die möglichen Ausgänge eines frei gezogenen Minispiels, jeweils mit Knopftext und Münzbuchung
function minispielErgebnisse() {
  const m = spiel.minispiel;
  const mg = MINISPIELE[m.nr];
  const alle = spiel.spieler.map((_, i) => i);

  switch (mg.kategorie) {
    case "duell": {
      const paar = [m.herausforderer, m.gegner];
      return paar.map((sieger, k) => {
        const verlierer = paar[1 - k];
        return {
          text: `${name(sieger)} gewinnt (${vorzeichen(mg.sieger)}${mg.verlierer ? `, ${name(verlierer)} ${vorzeichen(mg.verlierer)}` : ""})`,
          tun: () => { plus([sieger], mg.sieger); if (mg.verlierer) plus([verlierer], mg.verlierer); },
          gewinner: [sieger]
        };
      });
    }
    case "alle":
      return alle.filter(i => i !== m.richter).map(i => ({
        text: `${name(i)} gewinnt (${vorzeichen(mg.sieger)})`,
        tun: () => { plus([i], mg.sieger); if (mg.richter) plus([m.richter], mg.richter); },
        gewinner: [i]
      }));
    case "einer": {
      const gruppe = alle.filter(i => i !== m.einzelner);
      const liste = [{ text: `${name(m.einzelner)} gewinnt (${vorzeichen(mg.einzeln)})`, tun: () => plus([m.einzelner], mg.einzeln), gewinner: [m.einzelner] }];
      if (mg.gruppe) liste.push({ text: `Die Gruppe gewinnt (je ${vorzeichen(mg.gruppe)})`, tun: () => plus(gruppe, mg.gruppe), gewinner: gruppe });
      if (mg.scheitern) liste.push({ text: `${name(m.einzelner)} scheitert (${vorzeichen(mg.scheitern)})`, tun: () => plus([m.einzelner], mg.scheitern), gewinner: [] });
      return liste;
    }
    case "team":
      return m.teams.map((team, k) => ({
        text: `Team ${k + 1} gewinnt (je ${vorzeichen(mg.team)})`,
        tun: () => plus(team, mg.team),
        gewinner: team
      }));
    case "ungleich":
      return [
        { text: `${mg.einzelName} ${name(m.riese)} gewinnt (${vorzeichen(mg.riese)})`, tun: () => plus([m.riese], mg.riese), gewinner: [m.riese] },
        { text: `Die ${mg.paarName} gewinnen (je ${vorzeichen(mg.zwerge)})`, tun: () => plus(m.zwerge, mg.zwerge), gewinner: m.zwerge }
      ];
  }
  return [];
}

function minispielGegner(i) {
  spiel.minispiel.gegner = i;
  speichern();
  zeichnen();
}

// Ein Ergebnisknopf wurde gedrückt: Münzen buchen und zurück zur Übersicht
function minispielAuswerten(k) {
  const ergebnis = minispielErgebnisse()[k];
  if (!ergebnis) return;
  const vorher = spiel.spieler.map(s => s.muenzen);
  ergebnis.tun();
  minispielBeendet(ergebnis.gewinner || [], vorher, minispielTeilnehmer());
  zeige("uebersicht");
}

/* --- Der Zeitgeber für Ereignisse ---
   Wir merken uns nicht "noch 14 Minuten", sondern die Uhrzeit, zu der
   das nächste Ereignis fällig ist (timerEnde). So läuft die Zeit auch weiter,
   wenn das Handy zwischendurch gesperrt ist. */

function abenteuerStarten() {
  spiel.abenteuerLaeuft = true;
  spiel.timerEnde = null; // wird beim Betreten der Übersicht gesetzt
  zeige("uebersicht");
}

function pruefungBeenden() {
  spiel.abenteuerLaeuft = false;
  spiel.timerEnde = null;
  zeige("aufgaben");
}

function restzeitMs() {
  return Math.max(0, (spiel.timerEnde || 0) - Date.now());
}

// Macht aus Millisekunden einen Text wie "14:05"
function zeitText(ms) {
  const sekunden = Math.ceil(ms / 1000);
  return Math.floor(sekunden / 60) + ":" + String(sekunden % 60).padStart(2, "0");
}

// Wird jede Sekunde aufgerufen
function tick() {
  if (!spiel.abenteuerLaeuft || !spiel.timerEnde) return;
  const rest = restzeitMs();

  // Anzeige auf der Übersicht aktualisieren (falls sie gerade zu sehen ist)
  const anzeige = document.getElementById("restzeit");
  if (anzeige) {
    anzeige.textContent = zeitText(rest);
    document.getElementById("balken-fuellung").style.width = Math.min(100, 100 * rest / (minuten() * 60000)) + "%";
  }

  // Zeit abgelaufen: Ereigniskarte automatisch aufdecken
  if (rest === 0) {
    // Während eines Minispiels wird nicht unterbrochen: Die Karte kommt danach.
    const imAbenteuer = ["uebersicht", "spiel", "regeln", "anleitung", "rollen", "einstellungen"].includes(spiel.bildschirm);
    if (imAbenteuer) {
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
      ereignisZiehen(true);
    }
  }
}

/* --- Auf eine Rolle raten --- */
function ratenBeginnen() {
  spiel.raten = { schritt: "wer", wer: null };
  zeige("raten");
}

// Wie viele Mitspieler von Spieler i sind noch nicht erraten?
function nochZuErraten(i) {
  return spiel.spieler.filter((s, j) => j !== i && !s.frei).length;
}

// Raten darf nur, wer mindestens 1 Münze hat und noch jemanden erraten kann
function kannRaten(i) {
  return spiel.spieler[i].muenzen >= ratenKosten() && nochZuErraten(i) > 0;
}

function ratenWer(i) {
  if (!kannRaten(i)) return;
  spiel.raten = { schritt: "setzen", wer: i };
  zeige("raten");
}

function ratenSetzen() {
  const rater = spiel.spieler[spiel.raten.wer];
  const kosten = ratenKosten();
  if (rater.muenzen < kosten) return;
  rater.muenzen -= kosten;          // Münze setzen (bei "Lose Zungen" kostenlos)
  spiel.raten.gratis = kosten === 0;
  spiel.raten.schritt = "ergebnis";
  zeige("raten");
}

function ratenErgebnis(richtig) {
  spiel.raten.schritt = richtig ? "wen" : "falsch";
  zeige("raten");
}

function ratenWen(i) {
  if (spiel.spieler[i].frei) return; // wer schon erraten wurde, zählt nicht nochmal
  const bonus = spiel.seherBonus ? 5 : 3;          // 5 während der "Nacht der Seher"
  spiel.spieler[spiel.raten.wer].muenzen += bonus; // Belohnung für den Treffer
  spiel.raten.bonus = bonus;
  spiel.spieler[i].frei = true;                // Häkchen "Rolle erraten" setzen
  spiel.raten.wen = i;
  spiel.raten.schritt = "richtig";
  zeige("raten");
}

/* --- Besondere Fähigkeiten --- */
function faehigkeitBeginnen() {
  spiel.faehigkeit = { schritt: "wer" };
  zeige("faehigkeit");
}

function faehigkeitWer(i) {
  const s = spiel.spieler[i];
  if (!s.frei || s.benutzt) return;
  spiel.faehigkeit = { schritt: "zeigen", wer: i };
  // Spielmann: drei Minispiele zur Auswahl
  if (ROLLEN[s.rolle].faehigkeit.code === "zugabe") {
    spiel.faehigkeit.optionen = mischen(aktive(MINISPIELE)).slice(0, 3);
  }
  zeige("faehigkeit");
}

// Fähigkeiten, die einfach Münzen bringen
function faehigkeitTun() {
  const i = spiel.faehigkeit.wer;
  const code = ROLLEN[spiel.spieler[i].rolle].faehigkeit.code;
  if (code === "schatzsucher") plus([i], 3);
  if (code === "gluecksbringerin") {
    plus([i], verlustDurchEreignis(i));
    spiel.ereignis.geschuetzt = spiel.ereignis.geschuetzt || {};
    spiel.ereignis.geschuetzt[i] = true;
  }
  if (code === "trinkgeld") {
    plus([i], 2);
    spiel.letzteTeilnehmer = [];
  }
  if (code === "suppe") {
    plus([i], 3);
    spiel.ereignis.geschuetzt = spiel.ereignis.geschuetzt || {};
    spiel.ereignis.geschuetzt[i] = true;
  }
  if (code === "goldfinger") {
    plus([i], Math.min((spiel.letzteGewinne || {})[i] || 0, 3));
    delete spiel.letzteGewinne[i];
  }
  spiel.spieler[i].benutzt = true;
  zeige("uebersicht");
}

// Wie viele Münzen hat Spieler i durch das letzte Ereignis verloren?
function verlustDurchEreignis(i) {
  const e = spiel.ereignis;
  if (!e || !e.verlust || (e.geschuetzt && e.geschuetzt[i])) return 0;
  return e.verlust[i] || 0;
}

// Präzisionsmeister: Sieg ankündigen und direkt ein passendes Minispiel ziehen
function praezisionStarten(kategorie) {
  const i = spiel.faehigkeit.wer;
  spiel.siegBonus = { wer: i, betrag: 3 };
  spiel.spieler[i].benutzt = true;
  minispielZiehen(kategorie, false, i);
}

// Pfadfinderin und Schicksalswender: Ab dem Ansehen ist die Fähigkeit verbraucht
function faehigkeitAnsehen() {
  const i = spiel.faehigkeit.wer;
  const code = ROLLEN[spiel.spieler[i].rolle].faehigkeit.code;
  naechsteEreignisse(["schicksalswender", "zukunft"].includes(code) ? 2 : 1); // Stapel vorbereiten
  spiel.spieler[i].benutzt = true;
  spiel.faehigkeit.schritt = "ansehen";
  zeige("faehigkeit");
}

// Die obersten n Karten des Ereignisstapels (oberste zuerst), ohne sie zu ziehen
function naechsteEreignisse(n) {
  const stapel = spiel.ereignisStapel || [];
  if (stapel.length < n) {
    // Zu wenige Karten: frisch gemischte Karten unten drunterlegen
    const neu = mischen(aktive(EREIGNISSE).filter(i => !stapel.includes(i)));
    spiel.ereignisStapel = neu.concat(stapel);
  }
  return spiel.ereignisStapel.slice(-n).reverse();
}

function pfadfinderin(spielen) {
  if (spielen) { ereignisZiehen(false); return; } // zieht genau die angesehene Karte
  const nr = spiel.ereignisStapel.pop();
  spiel.ereignisStapel.unshift(nr); // ganz nach unten
  zeige("uebersicht");
}

function schicksal(gewaehlt, andere) {
  spiel.ereignisStapel = spiel.ereignisStapel.filter(nr => nr !== gewaehlt && nr !== andere);
  spiel.ereignisStapel.unshift(andere); // die andere Karte kommt unter den Stapel
  ereignisZiehen(false, gewaehlt);
}

// Glücksfee: Die App wirft die Münze
function gluecksfee(seite) {
  const f = spiel.faehigkeit;
  const i = f.wer;
  f.seite = seite;
  f.wurf = Math.random() < 0.5 ? "Kopf" : "Zahl";
  f.gewonnen = f.wurf === seite;
  if (f.gewonnen) plus([i], 4);
  spiel.spieler[i].benutzt = true;
  speichern();
  zeichnen();
}

// Wird nach jedem ausgewerteten Minispiel aufgerufen
function minispielBeendet(gewinner, vorher, teilnehmer) {
  // Für das Trinkgeld merken, wer mitgespielt hat
  spiel.letzteTeilnehmer = teilnehmer || spiel.spieler.map((_, i) => i);
  // Für den Goldfinger merken, was jeder Gewinner gerade bekommen hat
  spiel.letzteGewinne = {};
  gewinner.forEach(i => {
    const plusMuenzen = spiel.spieler[i].muenzen - vorher[i];
    if (plusMuenzen > 0) spiel.letzteGewinne[i] = plusMuenzen;
  });
  // Präzisionsmeister, Spielmann, Raufbold: Gibt es einen Extra-Gewinn?
  const bonus = spiel.siegBonus;
  spiel.siegBonus = null;
  if (bonus && gewinner.includes(bonus.wer)) plus([bonus.wer], bonus.betrag);
}

/* --- Fähigkeiten aus dem Goldenen Krug --- */

// Wirt: angesehene Karte spielen (+1 Münze) oder unter den Stapel legen
function hausrecht(spielen) {
  const i = spiel.faehigkeit.wer;
  if (spielen) { plus([i], 1); ereignisZiehen(false); return; }
  const nr = spiel.ereignisStapel.pop();
  spiel.ereignisStapel.unshift(nr);
  zeige("uebersicht");
}

// Trunkenbold: zufällige Belohnung von 1 bis 4 Münzen
function narr() {
  const f = spiel.faehigkeit;
  if (f.belohnung) return;
  f.belohnung = 1 + Math.floor(Math.random() * 4);
  plus([f.wer], f.belohnung);
  spiel.spieler[f.wer].benutzt = true;
  speichern();
  zeichnen();
}

// Spielmann: das gewählte Minispiel starten, bei Sieg 2 Münzen extra
function zugabe(nr) {
  const i = spiel.faehigkeit.wer;
  spiel.siegBonus = { wer: i, betrag: 2 };
  spiel.spieler[i].benutzt = true;
  minispielStarten(nr, false, i);
}

// Hellseherin: bestimmt die Reihenfolge der nächsten zwei Karten
function zukunft(zuerst, danach) {
  spiel.ereignisStapel = spiel.ereignisStapel.filter(nr => nr !== zuerst && nr !== danach);
  spiel.ereignisStapel.push(danach, zuerst); // die oberste Karte ist die letzte in der Liste
  zeige("uebersicht");
}

// Raufbold: Duell gegen einen Gegner seiner Wahl, bei Sieg 2 Münzen extra
function herausforderung() {
  const i = spiel.faehigkeit.wer;
  spiel.siegBonus = { wer: i, betrag: 2 };
  spiel.spieler[i].benutzt = true;
  minispielZiehen("duell", false, i);
}

// Falschspielerin: direkt beim Minispiel einsetzen
function gezinktEinsetzen(i) {
  if (spiel.spieler[i].benutzt) return;
  spiel.spieler[i].benutzt = true;
  spiel.minispiel.gezinkt = i;
  speichern();
  zeichnen();
}

// Gibt bis zu n Münzen von einem Spieler an einen anderen
function uebertragen(von, an, n) {
  const betrag = Math.min(n, spiel.spieler[von].muenzen);
  spiel.spieler[von].muenzen -= betrag;
  spiel.spieler[an].muenzen += betrag;
}

// Wer hat beim gerade ausgewerteten (frei gezogenen) Minispiel mitgespielt?
function minispielTeilnehmer() {
  const m = spiel.minispiel;
  const mg = MINISPIELE[m.nr];
  const alle = spiel.spieler.map((_, i) => i);
  if (mg.kategorie === "duell") return [m.herausforderer, m.gegner];
  if (mg.kategorie === "ungleich") return [m.riese, ...m.zwerge];
  if (mg.kategorie === "alle" && mg.richter) return alle.filter(i => i !== m.richter);
  return alle;
}

// Was ein Raten-Tipp gerade kostet ("Lose Zungen" macht ihn kostenlos)
function ratenKosten() { return spiel.ratenGratis ? 0 : 1; }

// Vom Spielende zurück ins laufende Abenteuer
function weiterspielen() {
  spiel.abenteuerLaeuft = true;
  spiel.timerEnde = null;
  zeige("uebersicht");
}

// Gleiche Namen, gleiches Abenteuer, neue Rollen
function nochmal() {
  spiel.abenteuerLaeuft = false;
  spiel.timerEnde = null;
  spiel.spieler = [];
  zeige("namen");
}

function neuesSpiel() {
  spiel.abenteuerLaeuft = false;
  spiel.timerEnde = null;
  spiel.spieler = [];
  zeige("start");
}

/* -----------------------------------------------------------------
   F) ZEICHNEN: den passenden Bildschirm in die Seite schreiben
   ----------------------------------------------------------------- */
function zeichnen() {
  const bildschirme = {
    start: bildschirmStart,
    titel: bildschirmTitel,
    regeln: bildschirmRegeln,
    einstellungen: bildschirmEinstellungen,
    anleitung: bildschirmAnleitung,
    meinerolle: bildschirmMeineRolle,
    rollen: bildschirmRollen,
    namen: bildschirmNamen,
    weitergabe: bildschirmWeitergabe,
    einfuehrung: bildschirmEinfuehrung,
    uebersicht: bildschirmUebersicht,
    raten: bildschirmRaten,
    faehigkeit: bildschirmFaehigkeit,
    karte: bildschirmUebersicht, // aus einer älteren Version
    ereignis: bildschirmEreignis,
    minispiel: bildschirmMinispiel,
    spiel: bildschirmSpiel,
    aufgaben: bildschirmAufgaben,
    ende: bildschirmEnde
  };
  const funktion = bildschirme[spiel.bildschirm] || bildschirmStart;
  document.getElementById("app").innerHTML = funktion();
  // Das Waldbild als Hintergrund nur bei der Geschichte der Waldgilde
  document.getElementById("hintergrund").hidden = !(spiel.bildschirm === "einfuehrung" && A() && A().id === "wald");
  if (spiel.bildschirm === "namen") pruefeNamen();
  rahmenZeichnen();
}

/* -----------------------------------------------------------------
   G) DAS EIGENE HANDY: QR-Code, Spieltisch und Spielerseite
   ----------------------------------------------------------------- */

// Ein zufälliger Code aus 12 Zeichen, den niemand erraten kann
function zufallsCode() {
  const zeichen = "abcdefghijkmnpqrstuvwxyz23456789";
  const zahlen = new Uint32Array(12);
  try { crypto.getRandomValues(zahlen); } catch (e) { zahlen.forEach((_, i) => zahlen[i] = Math.floor(Math.random() * 1e9)); }
  return Array.from(zahlen, z => zeichen[z % zeichen.length]).join("");
}

// Die Adresse der eigenen Seite eines Spielers: Abenteuer, Rolle und geheimer Code
function spielerAdresse(i) {
  const s = spiel.spieler[i];
  if (!s.zugang) { s.zugang = zufallsCode(); speichern(); } // Partien aus älteren Versionen
  return `${SPIELER_LINK}#v.${A().id}.${ROLLEN[s.rolle].id}.${s.zugang}`;
}

// Zeichnet einen QR-Code als Bild (SVG)
function qrBild(text) {
  if (typeof QRKodierer === "undefined") return "";
  try {
    const q = new QRKodierer.QRCode(-1, QRKodierer.Stufe.M);
    q.addData(text);
    q.make();
    const n = q.getModuleCount(), rand = 3, g = n + 2 * rand;
    let pfad = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (q.isDark(r, c)) pfad += `M${c + rand} ${r + rand}h1v1h-1z`;
    }
    return `<svg class="qr" viewBox="0 0 ${g} ${g}" role="img" aria-label="QR-Code zu deiner Rollenseite" shape-rendering="crispEdges"><rect width="${g}" height="${g}" fill="#fff"/><path d="${pfad}" fill="#000"/></svg>`;
  } catch (e) { return ""; }
}

// Der Kasten mit dem QR-Code unter der Rollenkarte
function qrAbschnitt(i) {
  const bild = qrBild(spielerAdresse(i));
  if (!bild) return "";
  return `
    <div class="qr-kasten">
      ${bild}
      <div>
        <p><strong>Auf dein eigenes Handy holen:</strong> Scanne den Code mit deiner Kamera. Dann kannst du deine Rolle jederzeit selbst nachlesen.</p>
      </div>
    </div>`;
}

// Was das Handy eines Spielers sehen darf. Die Rolle steht NICHT darin, nur im QR-Code.
function tischDaten(s) {
  return {
    name: s.name,
    muenzen: s.muenzen,
    frei: Boolean(s.frei),
    benutzt: Boolean(s.benutzt),
    abenteuer: spiel.abenteuer || "wald",
    phase: spiel.abenteuerLaeuft ? "laeuft" : (["aufgaben", "ende"].includes(spiel.bildschirm) ? "ende" : "start"),
    timerEnde: spiel.abenteuerLaeuft && spiel.timerEnde ? spiel.timerEnde : 0,
    hinweise: [
      spiel.seherBonus && "Die Nacht der Seher: Bis zum nächsten Ereignis bringt ein Treffer beim Raten 5 Münzen.",
      spiel.ratenGratis && "Lose Zungen: Bis zum nächsten Ereignis kostet Raten keine Münze.",
      spiel.siegBonus && spiel.spieler[spiel.siegBonus.wer] === s && `Gewinnst du das nächste Minispiel, gibt es ${spiel.siegBonus.betrag} Münzen extra.`
    ].filter(Boolean)
  };
}

// Überträgt geänderte Münzstände an die Handys der Spieler (nur was sich wirklich geändert hat)
async function tischSync() {
  if (!tischDb || eigene || !spiel.spieler || !spiel.spieler.length) return;
  if (tischLaeuft) { tischNochmal = true; return; }
  tischLaeuft = true;
  try {
    for (const s of spiel.spieler) {
      if (!s.zugang) continue;
      const daten = tischDaten(s);
      const vergleich = JSON.stringify(daten);
      if (tischLetzte[s.zugang] === vergleich) continue;
      try {
        await tischDb.doc("tische/" + s.zugang).set(Object.assign(daten, { stand: Date.now() }));
        tischLetzte[s.zugang] = vergleich;
      } catch (e) {
        if (e && e.code === "invalid_argument") { tischDb = null; break; } // dieses Konto darf nicht schreiben
      }
    }
  } finally {
    tischLaeuft = false;
    if (tischNochmal) { tischNochmal = false; tischSync(); }
  }
}

// Löscht die Spielerseiten der letzten Partie, bevor neue Rollen verteilt werden
function tischAufraeumen() {
  if (!tischDb || !spiel.spieler) return;
  spiel.spieler.forEach(s => {
    if (!s.zugang) return;
    delete tischLetzte[s.zugang];
    tischDb.doc("tische/" + s.zugang).delete().catch(() => {});
  });
}

// Verbindet das Spielleiter-Handy mit dem Spieltisch (klappt nur in der veröffentlichten App)
function tischVerbinden() {
  const versuch = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  versuch.then(db => { tischDb = db; tischSync(); }).catch(() => {});
}

// Ist diese Seite über einen QR-Code geöffnet worden? Dann steht z. B. "#v-wald-3-abc..." in der Adresse.
function eigeneSeiteAusAdresse() {
  const treffer = /^#v\.([a-z0-9-]+)\.([a-z0-9-]+)\.([a-z0-9]{6,24})$/.exec(location.hash || "");
  if (!treffer) return null;
  return { abenteuer: treffer[1], rolleId: treffer[2], zugang: treffer[3], status: "laden", daten: null, offen: false };
}

function eigeneSeiteStarten() {
  eigeneZeichnen();
  setInterval(eigeneUhr, 1000);
  const versuch = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  versuch.then(db => {
    if (!db) { eigene.status = "ohne"; eigeneZeichnen(); return; }
    db.doc("tische/" + eigene.zugang).onSnapshot(snap => {
      eigene.daten = snap.exists ? snap.data() : null;
      eigene.status = snap.exists ? "ok" : "leer";
      eigeneZeichnen();
    }, () => { eigene.status = "ohne"; eigeneZeichnen(); });
  }).catch(() => { eigene.status = "ohne"; eigeneZeichnen(); });
}

function eigeneZeichnen() {
  document.getElementById("app").innerHTML = bildschirmEigene();
  document.querySelectorAll(".rahmen-oben, .rahmen-unten").forEach(e => e.hidden = true);
  document.getElementById("hintergrund").hidden = true;
}

// Zählt auf der Spielerseite die Zeit bis zum nächsten Ereignis herunter
function eigeneUhr() {
  const feld = document.getElementById("eigene-zeit");
  const d = eigene && eigene.daten;
  if (feld && d && d.timerEnde) feld.textContent = zeitText(Math.max(0, d.timerEnde - Date.now()));
}

function bildschirmEigene() {
  const a = ABENTEUER[eigene.abenteuer];
  const r = a && a.rollen.find(x => x.id === eigene.rolleId);
  const d = eigene.daten;
  if (!a || !r) return `
    <div class="eigene-kopf"><span class="eyebrow">Valdrien</span><h1>Deine Rolle</h1></div>
    <p class="hinweis">${inhaltQuelle === "live" ? "Diese Rolle gibt es nicht mehr. Frag am Tisch nach einem neuen QR-Code." : "Die Rolle wird geladen …"}</p>`;

  let muenzen;
  if (eigene.status === "laden") {
    muenzen = `<p class="leise">Verbinde mit dem Spieltisch …</p>`;
  } else if (eigene.status === "ohne") {
    muenzen = `<p class="leise">Deine Münzen siehst du am Spielleiter-Handy.</p>`;
  } else if (eigene.status === "leer") {
    muenzen = `<p class="leise">Noch keine Münzen vom Spieltisch. Sie erscheinen, sobald der Spielleiter die App angemeldet geöffnet hat.</p>`;
  } else {
    const status = !d.frei ? `<span class="chip">noch nicht erraten</span>`
      : d.benutzt ? `<span class="chip">erraten</span><span class="chip">Fähigkeit benutzt</span>`
      : `<span class="chip">erraten</span><span class="chip chip-wald">Fähigkeit bereit</span>`;
    muenzen = `
      <span class="etikett">Deine Münzen</span>
      <span class="eigene-zahl">${Number(d.muenzen) || 0}<span class="muenze-klein" aria-hidden="true"></span></span>
      <div class="chips">${status}</div>
      ${d.phase === "laeuft" && d.timerEnde ? `<span class="eigene-uhr">Nächstes Ereignis in <strong id="eigene-zeit">${zeitText(Math.max(0, d.timerEnde - Date.now()))}</strong></span>` : ""}
      ${d.phase === "start" ? `<span class="eigene-uhr">Das Abenteuer beginnt gleich.</span>` : ""}
      ${d.phase === "ende" ? `<span class="eigene-uhr">Das Abenteuer ist zu Ende. Am Tisch wird jetzt gezählt.</span>` : ""}`;
  }
  const hinweise = d && Array.isArray(d.hinweise) ? d.hinweise.map(h => `<p class="hinweis">${sicher(h)}</p>`).join("") : "";

  return `
    <div class="eigene-kopf">
      <span class="eyebrow">${a.titel}</span>
      <h1>${d && d.name ? sicher(d.name) : "Deine Rolle"}</h1>
    </div>
    <div class="eigene-muenzen" aria-live="polite">${muenzen}</div>
    ${hinweise}
    ${eigene.offen ? `
      ${rollenkarte(r)}
      <button class="knopf-leise" onclick="eigene.offen = false; eigeneZeichnen()">Rolle verdecken</button>` : `
      <div class="verdeckt">
        <span class="wer">Deine Rolle</span>
        <p class="leise">Verdeckt, damit niemand mitliest.</p>
        <button class="knopf" onclick="eigene.offen = true; eigeneZeichnen()">Rolle aufdecken</button>
      </div>`}
    <p class="leise" style="text-align:center">Diese Seite aktualisiert sich von selbst. Leg sie dir auf den Home-Bildschirm, dann findest du sie schnell wieder.</p>
  `;
}

// Los geht's!

/* --- Verbindung zu Supabase (Werte aus verbindung.js) --- */
const VERBINDUNG = window.VALDRIEN_VERBINDUNG || {};
function projektAdresse(roh) {
  const text = String(roh || "").trim();
  if (!text) return "";
  const dashboard = /supabase\.com\/dashboard\/project\/([a-z0-9]+)/i.exec(text);
  if (dashboard) return `https://${dashboard[1]}.supabase.co`;
  try { return new URL(/^https?:\/\//i.test(text) ? text : "https://" + text).origin; } catch (e) { return ""; }
}
const PROJEKT_URL = projektAdresse(VERBINDUNG.url);
const PROJEKT_SCHLUESSEL = String(VERBINDUNG.anonKey || "").trim();

// Was zu tun ist, wenn neuer Inhalt da ist
function nachNeuemInhalt() {
  if (eigene) { eigeneZeichnen(); return; }
  if (spiel.bildschirm === "namen") return;  // nicht beim Tippen stören
  zeichnen();
}

// Holt den aktuellen Inhalt aus Supabase
async function inhaltHolen() {
  if (!PROJEKT_URL || !PROJEKT_SCHLUESSEL) return;
  try {
    const antwort = await fetch(`${PROJEKT_URL}/rest/v1/inhalt?id=eq.valdrien&select=daten,version`,
      { headers: { apikey: PROJEKT_SCHLUESSEL }, cache: "no-store" });
    if (!antwort.ok) return;
    const zeilen = await antwort.json();
    const zeile = zeilen && zeilen[0];
    if (!zeile || (zeile.version === inhaltVersion && inhaltQuelle === "live")) return;
    if (!inhaltAnwenden(zeile.daten, "live")) return;
    inhaltVersion = zeile.version;
    try { localStorage.setItem("valdrien-inhalt", JSON.stringify({ version: zeile.version, daten: zeile.daten })); } catch (e) {}
    speichern();
    nachNeuemInhalt();
  } catch (e) { /* kein Netz: mit dem bisherigen Inhalt weiterspielen */ }
}

// Live: Supabase meldet jede Änderung aus dem CMS sofort
function inhaltLiveAbonnieren() {
  let warten = null;
  const bald = () => { clearTimeout(warten); warten = setTimeout(inhaltHolen, 300); };
  if (window.supabase && PROJEKT_URL && PROJEKT_SCHLUESSEL) {
    try {
      window.supabase.createClient(PROJEKT_URL, PROJEKT_SCHLUESSEL, { auth: { persistSession: false } })
        .channel("spiel-inhalt")
        .on("postgres_changes", { event: "*", schema: "public", table: "inhalt" }, bald)
        .subscribe();
    } catch (e) {}
  }
  setInterval(inhaltHolen, 120000);                                     // zur Sicherheit alle 2 Minuten
  document.addEventListener("visibilitychange", () => { if (!document.hidden) inhaltHolen(); }); // Handy entsperrt
  window.addEventListener("online", inhaltHolen);                        // wieder Netz
}

// 1. Sofort: den zuletzt geladenen Inhalt nehmen, sonst den eingebauten
(function inhaltStarten() {
  let gespeichert = null;
  try { gespeichert = JSON.parse(localStorage.getItem("valdrien-inhalt") || "null"); } catch (e) {}
  if (gespeichert && inhaltAnwenden(gespeichert.daten, "gespeichert")) inhaltVersion = gespeichert.version || 0;
  else inhaltAnwenden(EINGEBAUTER_INHALT, "eingebaut");
})();

eigene = eigeneSeiteAusAdresse();
if (eigene) {
  // Über den QR-Code geöffnet: nur die eigene Seite dieses Spielers zeigen
  eigeneSeiteStarten();
} else {
  laden();
  // Den Inhalt noch einmal anwenden: jetzt mit der Platz-Reihenfolge der gespeicherten Partie
  inhaltAnwenden(letzterInhalt, inhaltQuelle);
  // Eine aufgedeckte Karte nach dem Neuladen lieber wieder verbergen
  spiel.aufgedeckt = false;
  if (spiel.meine) spiel.meine.offen = false;
  zeichnen();

  // Den Zeitgeber jede Sekunde prüfen, und sofort, wenn das Handy wieder entsperrt wird
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", tick);

  // Münzen an die Handys der Spieler übertragen
  tischVerbinden();
}

// 2. Danach: aktuellen Inhalt aus Supabase holen und live mithören
inhaltHolen();
inhaltLiveAbonnieren();
</script>
