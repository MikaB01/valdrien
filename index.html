<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valdrien</title>
<!-- Für den iPhone-Home-Bildschirm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valdrien">
<meta name="theme-color" content="#2f4a33">
<style>
  /* Grundeinstellungen: Abstand zu Kamera-Aussparung und Home-Balken, keine Ränder */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<!-- Supabase: meldet sofort, wenn im CMS etwas geändert wurde -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- Deine Verbindungsdaten (dieselbe Datei wie für das CMS) -->
<script src="verbindung.js"></script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">

<!--
  ===================================================================
  TEIL 1: CSS – wie die App AUSSIEHT
  Hier stehen Farben, Schriften und Abstände.
  Probier mal: Ändere bei --gold die Farbe und lade die Seite neu.
  ===================================================================
-->
<style>
  [hidden] { display: none !important; }

  /* Layout: eine schmale Spalte wie ein Pergament, gemacht fürs Handy */
  :root {
    --grund: #ece3cc;        /* Pergament */
    --karte: #f6efdc;        /* hellere Karte */
    --text: #2b2a1f;         /* dunkle Tinte */
    --text-leise: #6b6450;
    --wald: #2f4a33;         /* tiefes Waldgrün */
    --wald-hell: #4d6b4f;
    --gold: #a87a1f;         /* warmes Gold */
    --linie: #cbbf9e;
    --auf-wald: #f3ead2;     /* Text auf grünen Knöpfen */

    /* Farben für das gezeichnete Waldbild */
    --himmel-oben: #f6e7b8; --himmel-unten: #e3d9b6; --licht: #f0c255;
    --baum-hinten: #b3bf9c; --baum-mitte: #6f8b63; --baum-vorne: #2a4230;
    --boden: #557253; --weg: #d8c48f;

    /* Farben für das gezeichnete Tavernenbild (in beiden Modi gleich: es ist dort immer Nacht) */
    --kneipe-wand: #3b2718; --kneipe-brett: #2a1b10; --kneipe-nacht: #182231;
    --kneipe-regen: #9fb3c8; --kneipe-blitz: #f4f0d8; --kneipe-holz: #6b4423;
    --kneipe-stein: #57514a; --kneipe-loch: #140b06; --kneipe-glut: #f0a040;
    --kneipe-flamme: #ffcf6e; --kneipe-krug: #b88a52; --kneipe-schaum: #f3ead2;
    --kneipe-kerze: #efe3c4;

    --schrift-titel: "IM Fell English SC", Georgia, serif;
    --schrift-erzaehl: "IM Fell English", Georgia, serif;
    --schrift-text: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --grund: #141c16; --karte: #1d2920; --text: #ebe2c8; --text-leise: #a49c84;
      --wald: #6f9a6c; --wald-hell: #8db58a; --gold: #d9ad4f; --linie: #34453a;
      --auf-wald: #101710; color-scheme: dark;
      --himmel-oben: #0d1820; --himmel-unten: #20332a; --licht: #e9d9a0;
      --baum-hinten: #2c4036; --baum-mitte: #1c2c23; --baum-vorne: #0b130e;
      --boden: #17241c; --weg: #4f4a35;
    }
  }
  :root[data-theme="dark"] {
    --grund: #141c16; --karte: #1d2920; --text: #ebe2c8; --text-leise: #a49c84;
    --wald: #6f9a6c; --wald-hell: #8db58a; --gold: #d9ad4f; --linie: #34453a;
    --auf-wald: #101710; color-scheme: dark;
    --himmel-oben: #0d1820; --himmel-unten: #20332a; --licht: #e9d9a0;
    --baum-hinten: #2c4036; --baum-mitte: #1c2c23; --baum-vorne: #0b130e;
    --boden: #17241c; --weg: #4f4a35;
  }

  body {
    background: var(--grund);
    color: var(--text);
    font-family: var(--schrift-text);
    font-size: 17px;
    line-height: 1.5;
  }
  main {
    max-width: 30rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  h1, h2 { font-family: var(--schrift-titel); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.15; }
  h1 { font-size: 2.1rem; color: var(--wald); text-align: center; }
  h2 { font-size: 1.6rem; color: var(--wald); }
  p { margin: 0; }
  .leise { color: var(--text-leise); font-size: 0.95rem; }
  .zier { text-align: center; color: var(--gold); letter-spacing: 0.6em; font-size: 0.9rem; }

  .erzaehlung { font-family: var(--schrift-erzaehl); font-size: 1.15rem; display: flex; flex-direction: column; gap: 12px; }

  /* Knöpfe */
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .knopf {
    background: var(--wald); color: var(--auf-wald);
    border: none; border-radius: 6px;
    padding: 14px 18px; font-size: 1.05rem; font-weight: 700;
    width: 100%;
  }
  .knopf:disabled { opacity: 0.4; cursor: not-allowed; }
  .knopf-leise {
    background: transparent; color: var(--wald);
    border: 1.5px solid var(--wald); border-radius: 6px;
    padding: 12px 18px; font-weight: 700; width: 100%;
  }

  /* Das gezeichnete Waldbild */
  .waldbild {
    margin: 6px; border-radius: 8px; overflow: hidden;
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 0 4px var(--grund), 0 0 0 5.5px var(--linie);
  }
  .waldbild svg { display: block; width: 100%; height: auto; }
  .himmel-oben { stop-color: var(--himmel-oben); }
  .himmel-unten { stop-color: var(--himmel-unten); }
  .glanz-mitte { stop-color: var(--licht); stop-opacity: 0.55; }
  .glanz-rand { stop-color: var(--licht); stop-opacity: 0; }
  .strahl { fill: var(--licht); opacity: 0.14; }
  .baum-hinten { fill: var(--baum-hinten); }
  .baum-mitte { fill: var(--baum-mitte); }
  .baum-vorne { fill: var(--baum-vorne); }
  .boden { fill: var(--boden); }
  .weg { fill: var(--weg); }
  .glueh { fill: var(--licht); opacity: 0.7; }
  @media (prefers-reduced-motion: no-preference) {
    .glueh { animation: funkeln 3.4s ease-in-out infinite; }
    @keyframes funkeln { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.95; } }
  }

  /* Hintergrundbild (liegt als eigene Datei neben dieser HTML-Datei) */
  #hintergrund {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background-size: cover; background-position: center;
    /* Das Bild selbst steht ganz unten in der Datei */
  }
  /* Ebene 1: das Bild vergrößert und verschwommen, damit keine leeren Ränder entstehen */
  #hintergrund::before {
    content: ""; position: absolute; inset: -40px;
    background-image: inherit; background-size: cover; background-position: center;
    filter: blur(24px) brightness(0.7);
  }
  /* Ebene 2: das ganze Bild scharf, so groß wie es auf den Bildschirm passt */
  #hintergrund::after {
    content: ""; position: absolute; inset: 0;
    background-image: inherit; background-size: contain;
    background-position: center; background-repeat: no-repeat;
  }
  /* Pergament-Tafel, damit Text auf dem Bild lesbar bleibt */
  .tafel {
    background: var(--karte);
    background: color-mix(in srgb, var(--karte) 90%, transparent);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1.5px solid var(--gold); border-radius: 8px;
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .bild-luecke { height: 34vh; }

  /* Auswahl der Abenteuer */
  .abenteuer-liste { display: flex; flex-direction: column; gap: 14px; }
  .abenteuer-karte {
    display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left;
    background: var(--karte); color: var(--text);
    border: 1.5px solid var(--gold); border-radius: 8px;
  }
  .abenteuer-karte:hover { box-shadow: 0 0 0 3px var(--linie); }
  .abenteuer-bild { display: block; height: 150px; background: var(--kneipe-wand); }
  .abenteuer-bild svg { display: block; width: 100%; height: 100%; }
  .abenteuer-bild-wald { background: var(--waldbild) center 42% / cover no-repeat; }
  .abenteuer-bild-gezeichnet { background: var(--himmel-unten); overflow: hidden; }
  .abenteuer-karte:disabled { opacity: 0.55; cursor: not-allowed; }
  .abenteuer-text { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px; }

  /* Das gezeichnete Tavernenbild */
  .tavernenbild { margin: 6px; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--gold); }
  .tavernenbild svg { display: block; width: 100%; height: auto; }
  .wand { fill: var(--kneipe-wand); }
  .brett { stroke: var(--kneipe-brett); stroke-width: 2; }
  .glut-mitte { stop-color: var(--kneipe-glut); stop-opacity: 0.35; }
  .glut-rand { stop-color: var(--kneipe-glut); stop-opacity: 0; }
  .nacht { fill: var(--kneipe-nacht); }
  .regen line { stroke: var(--kneipe-regen); stroke-width: 1.2; opacity: 0.55; }
  .blitz { fill: none; stroke: var(--kneipe-blitz); stroke-width: 2.5; opacity: 0; }
  .rahmen { fill: none; stroke: var(--kneipe-holz); stroke-width: 7; }
  .stein { fill: var(--kneipe-stein); }
  .stein-sims { fill: var(--kneipe-holz); }
  .loch { fill: var(--kneipe-loch); }
  .flamme { fill: var(--kneipe-glut); }
  .flamme-innen { fill: var(--kneipe-flamme); }
  .tisch { fill: var(--kneipe-holz); }
  .tischkante { stroke: var(--kneipe-brett); stroke-width: 3; }
  .krug rect { fill: var(--kneipe-krug); }
  .henkel { fill: none; stroke: var(--kneipe-krug); stroke-width: 5; }
  .schaum { fill: var(--kneipe-schaum); }
  .kerze { fill: var(--kneipe-kerze); }
  .kerzenflamme { fill: var(--kneipe-flamme); }
  @media (prefers-reduced-motion: no-preference) {
    .regen { animation: regnen 0.7s linear infinite; }
    @keyframes regnen { from { transform: translate(0, -20px); } to { transform: translate(-6px, 0); } }
    .blitz { animation: blitzen 9s infinite; }
    @keyframes blitzen { 0%, 88%, 91%, 93%, 100% { opacity: 0; } 89%, 92% { opacity: 1; } }
    .flamme, .flamme-innen, .kerzenflamme { transform-box: fill-box; transform-origin: 50% 100%; animation: flackern 1.6s ease-in-out infinite alternate; }
    .flamme-innen { animation-duration: 1.1s; }
    .kerzenflamme { animation-duration: 2.2s; }
    @keyframes flackern { from { transform: scale(1, 0.9); } to { transform: scale(0.95, 1.08); } }
  }

  /* Hauptmenü */
  .menue { display: flex; flex-direction: column; gap: 20px; padding-top: 2vh; }
  .menue-titel { font-size: 3.4rem; letter-spacing: 0.03em; }
  .menue-vorzeile {
    text-align: center; font-family: var(--schrift-erzaehl); font-style: italic;
    font-size: 1.15rem; color: var(--gold); margin-bottom: -14px;
  }
  .menue-spruch { text-align: center; font-family: var(--schrift-erzaehl); font-size: 1.15rem; text-wrap: balance; }
  .knopf-gross {
    padding: 20px 18px; font-size: 1.35rem;
    font-family: var(--schrift-titel); font-weight: 400; letter-spacing: 0.04em;
  }
  .knopf-reihe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Regelwerk */
  h3 { font-family: var(--schrift-titel); font-weight: 400; font-size: 1.3rem; color: var(--wald); margin: 0; }
  .regeln { display: flex; flex-direction: column; gap: 24px; }
  .regeln section { display: flex; flex-direction: column; gap: 6px; }
  .regeln ul, .regeln ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; }
  .offen { border: 1.5px dashed var(--linie); border-radius: 6px; padding: 14px 16px; }

  /* Spielübersicht: Kacheln */
  .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kachel {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    text-align: left; min-width: 0;
    background: var(--karte); color: var(--text);
    border: 1.5px solid var(--linie); border-radius: 8px;
    padding: 16px 14px;
  }
  .kachel:hover { border-color: var(--gold); }
  .kachel svg { width: 36px; height: 36px; fill: none; stroke: var(--gold); stroke-width: 1.8; stroke-linejoin: round; }
  .kachel svg .voll { fill: var(--gold); stroke: none; }
  .kachel-titel { font-family: var(--schrift-titel); font-size: 1.2rem; color: var(--wald); line-height: 1.15; }
  .kachel-text { font-size: 0.9rem; color: var(--text-leise); line-height: 1.35; }

  /* Breite Kachel für "Auf eine Rolle raten" */
  .kachel-breit { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; border-color: var(--gold); }
  .kachel-breit svg { flex-shrink: 0; }
  .kachel-inhalt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  /* Auswahlliste beim Raten */
  .auswahl { display: flex; flex-direction: column; gap: 8px; }
  .auswahl-knopf {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 16px; text-align: left; font-weight: 700;
    background: var(--karte); color: var(--text);
    border: 1.5px solid var(--linie); border-radius: 8px;
  }
  .auswahl-knopf:hover:not(:disabled) { border-color: var(--gold); }
  .auswahl-knopf:disabled { opacity: 0.45; cursor: not-allowed; }
  .auswahl-knopf .leise { font-weight: 400; white-space: nowrap; }
  .ergebnis-zahl { text-align: center; font-weight: 700; font-size: 2.4rem; color: var(--gold); font-variant-numeric: tabular-nums; }

  /* Münzwurf der Glücksfee */
  .muenzwurf {
    width: 120px; height: 120px; margin: 0 auto; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--gold); color: var(--karte);
    font-family: var(--schrift-titel); font-size: 1.5rem;
    box-shadow: inset 0 0 0 6px var(--gold), inset 0 0 0 8px var(--karte);
  }
  @media (prefers-reduced-motion: no-preference) {
    .muenzwurf { animation: wurf 1.2s ease-out; }
    @keyframes wurf { from { transform: rotateY(1440deg) scale(0.6); } to { transform: none; } }
  }

  /* Zeitgeber für Ereignisse */
  .zeitgeber {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 18px 16px; background: var(--karte);
    border: 1.5px solid var(--gold); border-radius: 8px;
  }
  .zeitgeber .zeit {
    font-weight: 700; font-size: 2.6rem; line-height: 1;
    color: var(--wald); font-variant-numeric: tabular-nums;
  }
  .balken { width: 100%; height: 6px; background: var(--linie); border-radius: 3px; overflow: hidden; }
  .balken div { height: 100%; background: var(--gold); transition: width 1s linear; }

  /* Knöpfe unter der Ereigniskarte */
  .aktionen { display: flex; flex-direction: column; gap: 16px; }
  .aktionen-gruppe { display: flex; flex-direction: column; gap: 8px; }
  .aktion {
    padding: 13px 16px; font-weight: 700; text-align: center;
    background: var(--wald); color: var(--auf-wald);
    border: 1.5px solid var(--wald); border-radius: 6px;
  }
  .aktion:disabled { background: transparent; color: var(--text-leise); border-color: var(--linie); cursor: default; }
  .aktion.gewaehlt { background: transparent; color: var(--wald); border-color: var(--wald); }
  .aktion-spiel { background: var(--karte); color: var(--wald); border-color: var(--gold); }
  .hinweis {
    text-align: center; font-family: var(--schrift-erzaehl); font-style: italic; font-size: 1.05rem;
    padding: 12px 14px; border: 1.5px dashed var(--gold); border-radius: 6px;
  }

  /* Gezogene Karte */
  .zugkarte .titel { display: flex; flex-direction: column; gap: 6px; }

  /* Spielernamen-Eingabe */
  .namen { display: flex; flex-direction: column; gap: 10px; }
  .namen-zeile { display: flex; gap: 8px; }
  .namen-zeile input {
    flex: 1; min-width: 0;
    font: inherit; padding: 11px 12px;
    background: var(--karte); color: var(--text);
    border: 1.5px solid var(--linie); border-radius: 6px;
  }
  .weg {
    background: transparent; border: 1.5px solid var(--linie); color: var(--text-leise);
    border-radius: 6px; width: 46px; font-size: 1.2rem;
  }

  /* Die Rollenkarte */
  .rollenkarte {
    background: var(--karte);
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    padding: 22px 20px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 0 0 5px var(--karte), 0 0 0 6.5px var(--linie);
    margin: 6px;
  }
  .rollenkarte .titel { text-align: center; }
  .rollenkarte .wer { font-family: var(--schrift-titel); font-size: 1.7rem; color: var(--wald); line-height: 1.1; }
  .rollenkarte .rolle { font-family: var(--schrift-erzaehl); font-style: italic; color: var(--text-leise); }
  .abschnitt { display: flex; flex-direction: column; gap: 4px; }
  .etikett {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--gold); font-weight: 700;
  }
  .abschnitt ul { margin: 0; padding-left: 1.1rem; }
  .muenzen-start { text-align: center; font-weight: 700; }

  /* Hauptbildschirm: Münzliste */
  .spielerliste { display: flex; flex-direction: column; border-top: 1px solid var(--linie); }
  .spieler {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--linie);
  }
  .spieler .name { font-weight: 700; font-size: 1.1rem; min-width: 0; overflow-wrap: anywhere; }
  .zaehler { display: flex; align-items: center; gap: 10px; }
  .zaehler button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--wald); background: transparent; color: var(--wald);
    font-size: 1.4rem; line-height: 1;
  }
  .zaehler .stand {
    min-width: 2.2ch; text-align: center; font-size: 1.5rem; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--gold);
  }
  .faehigkeit { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.92rem; color: var(--text-leise); }
  .faehigkeit label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .faehigkeit input { width: 18px; height: 18px; accent-color: var(--wald); }

  /* Spielende */
  .sieger { text-align: center; font-family: var(--schrift-titel); font-size: 2rem; color: var(--gold); }
  .rangliste { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
  .rangliste div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--linie); padding-bottom: 4px; }
  .aufgabe-check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--linie); }
  .aufgabe-check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--wald); flex-shrink: 0; }

  .weitergabe { text-align: center; display: flex; flex-direction: column; gap: 18px; padding-top: 30px; }
  .weitergabe .name-gross { font-family: var(--schrift-titel); font-size: 2.4rem; color: var(--wald); overflow-wrap: anywhere; }

  @media (prefers-reduced-motion: no-preference) {
    .rollenkarte { animation: aufdecken 0.45s ease-out; }
    @keyframes aufdecken { from { opacity: 0.2; transform: rotateY(70deg); } to { opacity: 1; transform: none; } }
  }
  /* =================================================================
     BEDIENUNG: größere Tippflächen, Spielstand, Kurzanleitung, Rollen
     ================================================================= */
  .knopf, .knopf-leise, .aktion, .auswahl-knopf, .kachel { min-height: 48px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: no-preference) {
    .knopf, .knopf-leise, .aktion, .auswahl-knopf, .kachel, .abenteuer-karte, .stand-tafel { transition: transform .12s ease, border-color .15s ease; }
    .knopf:active:not(:disabled), .knopf-leise:active, .aktion:active:not(:disabled), .auswahl-knopf:active:not(:disabled),
    .kachel:active, .abenteuer-karte:active, .stand-tafel:active { transform: scale(0.98); }
  }
  .kachel:focus-visible, .auswahl-knopf:focus-visible, .abenteuer-karte:focus-visible, .aktion:focus-visible,
  .knopf-leise:focus-visible, .stand-tafel:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .kopf { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); font-weight: 700; }

const EINGEBAUTER_INHALT = {"format": 1, "welt": {"name": "Valdrien", "spruch": "Ein Land voller Abenteuer, Geheimnisse und Gefährten, denen du nicht ganz trauen solltest."}, "abenteuer": {"wald": {"pos": 10, "name": "Die Prüfung der Waldgilde", "setting": "Draußen · für Wanderungen und Spaziergänge", "geschichte": {"titel": "Willkommen, Anwärter der Waldgilde!", "absaetze": ["Tief verborgen zwischen uralten Bäumen liegt der Sitz der legendären Waldgilde. Seit Jahrhunderten beschützt sie die Bewohner des Waldes, bewahrt seine magischen Geheimnisse und stellt sich Gefahren, denen andere nicht gewachsen sind.", "Doch die Gilde nimmt nicht jeden auf. Nur wer Mut, Geschick, Verstand und Gerissenheit beweist, darf Teil ihrer Gemeinschaft werden.", "Ihr wurdet aus allen Winkeln des Landes ausgewählt, um euch der Aufnahmeprüfung zu stellen. Jeder von euch kennt seine eigenen Fähigkeiten, doch eure Mitstreiter sind Fremde. Wer ist Freund, wer Rivale? Und wer verbirgt mehr, als er preisgibt?", "Stellt euch den Prüfungen, meistert unerwartete Begegnungen und sammelt Münzen. Lernt eure Mitstreiter kennen, durchschaut ihre Absichten und beweist, dass ihr den Herausforderungen des Waldes gewachsen seid.", "Am Ende wird nur einer von euch den begehrten Titel erringen und in die Reihen der Waldgilde aufgenommen werden."], "schluss": "Die Prüfung beginnt! Beweist euren Mut und zeigt dem Wald, dass ihr würdig seid!"}, "schlusstext": {"titel": "Die Aufnahme in die Waldgilde", "vorher": ["Die Prüfung ist vollbracht!", "Die Münzen sind gezählt, und es steht fest, wer gewonnen hat:"], "nachher": ["Mit Mut, Geschick und Verstand hast du deine Mitstreiter übertroffen und dich als würdig erwiesen.", "Im Namen der Waldgilde heißen wir dich willkommen! Mögest du ihre Geheimnisse bewahren, den Wald beschützen und viele Abenteuer bestehen.", "Herzlichen Glückwunsch, {sieger}! Dein Abenteuer als Mitglied der Waldgilde beginnt jetzt!"]}, "begriffe": {"frage": "Wer stellt sich der Prüfung?", "spieler": "Anwärter", "mehrzahl": "Anwärter", "dativ": "Anwärtern", "beenden": "Prüfung beenden"}, "rollen": {"magnus": {"pos": 10, "name": "Magnus", "bezeichnung": "der Mundschenk", "startkapital": 4, "hintergrund": "Magnus sorgt dafür, dass auf keiner Reise die Kehlen trocken bleiben. Ob Wasser, Saft oder ein kräftiger Schluck aus dem Krug – er kennt den Wert guter Vorräte und einer wohlverdienten Pause.", "charakter": "", "merkmale": ["Gastfreundlich, gesellig und aufmerksam.", "Hat Getränke und Vorräte im Blick.", "Schlägt gern eine gemeinsame Trinkpause vor."], "faehigkeit": {"name": "Schatzsucher", "text": "Einmal im Spiel erhält Magnus 3 Münzen aus der Spielbank.", "mechanik": "schatzsucher"}, "aufgabe": {"name": "Münzhorter", "text": "Gib während der gesamten Partie keine Münzen aus und besitze am Ende mindestens so viele Münzen wie zu Beginn. Münzen, die du beim Raten setzt, zählen nicht als Ausgabe.", "bonus": 3}}, "elara": {"pos": 20, "name": "Elara", "bezeichnung": "die Waldläuferin", "startkapital": 5, "hintergrund": "Elara kennt die verschlungenen Wege des Waldes und bemerkt Dinge, an denen andere achtlos vorbeigehen. Sie ist unabhängig, wachsam und immer bereit, den nächsten Hinweis zu entdecken.", "charakter": "", "merkmale": ["Beobachtet aufmerksam ihre Umgebung.", "Wirkt selbstständig und orientiert sich gern.", "Entdeckt kleine Details, Wegweiser oder besondere Lichtungen."], "faehigkeit": {"name": "Pfadfinderin", "text": "Einmal im Spiel darf Elara die nächste Ereigniskarte ansehen, bevor entschieden wird, ob sie gespielt wird.", "mechanik": "pfadfinderin"}, "aufgabe": {"name": "Wegkundige", "text": "Fotografiere zwei unterschiedliche Wegmarkierungen oder Wanderwegschilder, ohne den Weg zu verlassen.", "bonus": 2}}, "morgana": {"pos": 30, "name": "Morgana", "bezeichnung": "die Kräuterhexe", "startkapital": 3, "hintergrund": "Morgana kennt die alten Geschichten über Pflanzen, Wurzeln und geheimnisvolle Waldgewächse. Sie beobachtet lieber erst, bevor sie handelt, und scheint für alles einen kleinen Zauber oder Rat zu kennen.", "charakter": "", "merkmale": ["Geheimnisvoll, ruhig und neugierig.", "Interessiert sich für Pflanzen, Pilze und Naturdetails.", "Gibt gern rätselhafte Ratschläge oder spricht von alten Rezepturen."], "faehigkeit": {"name": "Glücksbringerin", "text": "Einmal im Spiel kann Morgana verhindern, dass sie durch ein Ereignis Münzen verliert. Sie muss die Fähigkeit beim drohenden Verlust einsetzen.", "mechanik": "gluecksbringerin"}, "aufgabe": {"name": "Sammlerin der Eindrücke", "text": "Mache drei Fotos: einen Baum, eine Kleinigkeit am Boden und eine besondere Aussicht.", "bonus": 3}}, "finnian": {"pos": 40, "name": "Finnian", "bezeichnung": "der Wald-Barde", "startkapital": 4, "hintergrund": "Finnian sammelt Geschichten, Legenden und Lieder, die von Generation zu Generation weitergegeben werden. Er liebt große Auftritte, dramatische Erzählungen und die kleinen Momente, aus denen später Legenden werden.", "charakter": "", "merkmale": ["Wortgewandt, kreativ und ausdrucksstark.", "Erzählt gern Geschichten oder kommentiert Ereignisse dramatisch.", "Hat oft einen Spruch, Reim oder eine passende Redewendung parat."], "faehigkeit": {"name": "Goldfinger", "text": "Einmal im Spiel darf Finnian seine Belohnung aus einem Minispiel verdoppeln, höchstens um 3 zusätzliche Münzen.", "mechanik": "goldfinger"}, "aufgabe": {"name": "Chronist", "text": "Sammle drei unterschiedliche Nachweise aus dem Abenteuer, z. B. ein Foto, eine erfüllte Aufgabe und einen gewonnenen Minispielbonus.", "bonus": 3}}, "roderick": {"pos": 50, "name": "Roderick", "bezeichnung": "der Waldritter", "startkapital": 5, "hintergrund": "Roderick hat geschworen, die Bewohner des Waldes und die Geheimnisse der Waldgilde zu beschützen. Er handelt entschlossen, nimmt Herausforderungen ernst und gibt nicht so schnell auf.", "charakter": "", "merkmale": ["Mutig, pflichtbewusst und entschlossen.", "Stellt sich gern Herausforderungen.", "Spricht von Ehre, Mut und dem Einhalten von Versprechen."], "faehigkeit": {"name": "Präzisionsmeister", "text": "Vor einem Minispiel kündigt Roderick seinen Sieg an. Schafft er es, erhält er 3 zusätzliche Münzen aus der Spielbank.", "mechanik": "praezisionsmeister"}, "aufgabe": {"name": "Glücksstein", "text": "Finde einen flachen Stein, der bereits auf dem Boden liegt, und trage ihn bis zum Ende bei dir.", "bonus": 2}}, "theobald": {"pos": 60, "name": "Theobald", "bezeichnung": "der Waldgelehrte", "startkapital": 4, "hintergrund": "Theobald studiert die Legenden der Waldgilde und glaubt, dass Wissen mächtiger sein kann als jedes Schwert. Er analysiert Situationen, stellt kluge Fragen und versucht, stets einen Schritt voraus zu sein.", "charakter": "", "merkmale": ["Nachdenklich, wissbegierig und analytisch.", "Erklärt gern Zusammenhänge oder stellt ungewöhnliche Fragen.", "Wirkt, als würde er jedes Detail auf seine Bedeutung prüfen."], "faehigkeit": {"name": "Schicksalswender", "text": "Einmal im Spiel darf Theobald zwei Ereigniskarten ziehen und entscheiden, welche gespielt wird. Die andere kommt unter den Stapel.", "mechanik": "schicksalswender"}, "aufgabe": {"name": "Kartograf", "text": "Mache ein Foto oder einen Screenshot der Wanderkarte bzw. deiner Route.", "bonus": 2}}, "liora": {"pos": 70, "name": "Liora", "bezeichnung": "die Waldfee", "startkapital": 3, "hintergrund": "Liora ist eng mit der Magie des Waldes verbunden. Sie wirkt verspielt und freundlich, doch hinter ihrem Lächeln steckt ein scharfer Verstand. Manchmal scheint ihr das Glück einfach in den Schoß zu fallen.", "charakter": "", "merkmale": ["Verspielt, charmant und ein wenig geheimnisvoll.", "Begeistert sich für schöne Kleinigkeiten und magische Zufälle.", "Reagiert auf Ereignisse gern mit Staunen oder schelmischen Kommentaren."], "faehigkeit": {"name": "Glücksfee", "text": "Einmal im Spiel wirft Liora eine Münze. Bei Erfolg erhält sie 4 Münzen aus der Spielbank, sonst keine. Vorher wird festgelegt, welche Seite Erfolg bedeutet.", "mechanik": "gluecksfee"}, "aufgabe": {"name": "Lichtfängerin", "text": "Fotografiere Sonnenlicht, das sichtbar durch die Bäume fällt.", "bonus": 2}}}, "minispiele": {"stein-blatt-zapfen": {"pos": 10, "name": "Stein, Blatt, Zapfen", "kategorie": "duell", "beschreibung": "Wie Schere, Stein, Papier: Der Stein zerdrückt den Zapfen, der Zapfen durchsticht das Blatt, das Blatt umhüllt den Stein. Wer zuerst 2 Runden gewinnt, siegt.", "belohnung": {"sieger": 2}}, "blinzelduell": {"pos": 20, "name": "Blinzelduell", "kategorie": "duell", "beschreibung": "Beide schauen sich in die Augen. Wer zuerst blinzelt, wegschaut oder lacht, verliert. Die anderen dürfen versuchen, sie zum Lachen zu bringen, aber ohne sie zu berühren.", "belohnung": {"sieger": 2}}, "zapfenwurf": {"pos": 30, "name": "Zapfenwurf", "kategorie": "duell", "beschreibung": "Jeder sucht sich einen Tannenzapfen vom Boden. Gemeinsam wählt ihr einen Baumstamm am Wegesrand als Ziel. Abwechselnd hat jeder drei Würfe. Wer öfter trifft, gewinnt. Nur werfen, wenn niemand in der Nähe ist, und die Zapfen danach zurücklegen.", "belohnung": {"sieger": 2}}, "wortgefecht": {"pos": 40, "name": "Wortgefecht", "kategorie": "duell", "beschreibung": "Ihr nennt abwechselnd ein Tier des Waldes. Wer länger als 5 Sekunden überlegt oder etwas wiederholt, verliert.", "belohnung": {"sieger": 2, "verlierer": -1}}, "der-schnellste-blick": {"pos": 50, "name": "Der schnellste Blick", "kategorie": "duell", "beschreibung": "Die anderen nennen etwas, das am Wegesrand zu finden ist, zum Beispiel »etwas Rotes« oder »ein Blatt mit Loch«. Wer es zuerst entdeckt und zeigt, gewinnt. Den Weg nicht verlassen!", "belohnung": {"sieger": 2}}, "schrittschaetzer": {"pos": 60, "name": "Schrittschätzer", "kategorie": "alle", "beschreibung": "Wählt einen Baum oder Punkt am Weg. Jeder schätzt, wie viele Schritte es bis dorthin sind. Einer zählt beim Gehen mit. Wer am nächsten dran ist, gewinnt.", "belohnung": {"sieger": 2}}, "welches-tier-bin-ich": {"pos": 70, "name": "Welches Tier bin ich?", "kategorie": "alle", "beschreibung": "Einer denkt sich ein Tier des Waldes aus, die anderen stellen reihum Ja-Nein-Fragen. Wer es errät, gewinnt. Nach 20 Fragen ohne Treffer gewinnt der, der es sich ausgedacht hat.", "belohnung": {"sieger": 2}}, "das-gedaechtnis-des-waldes": {"pos": 80, "name": "Das Gedächtnis des Waldes", "kategorie": "alle", "beschreibung": "Der Erste sagt »Im Wald fand ich …« und nennt etwas. Jeder wiederholt alles Bisherige und fügt etwas hinzu. Wer etwas vergisst oder durcheinanderbringt, scheidet aus. Der Letzte gewinnt.", "belohnung": {"sieger": 3}}, "das-gildenzeichen": {"pos": 90, "name": "Das Gildenzeichen", "kategorie": "alle", "beschreibung": "Alle zählen gemeinsam bis drei und zeigen dann mit den Fingern eine Zahl von 0 bis 5. Gewonnen hat, wer die höchste Zahl zeigt, die sonst niemand gezeigt hat. Gibt es keinen, wird wiederholt.", "belohnung": {"sieger": 2}}, "der-hoechste-turm": {"pos": 100, "name": "Der höchste Turm", "kategorie": "alle", "beschreibung": "Jeder baut in einer Minute aus Steinchen und Zapfen vom Wegesrand einen Turm. Der höchste Turm, der noch steht, gewinnt. Danach wieder abbauen.", "belohnung": {"sieger": 2}}, "der-waldrichter": {"pos": 110, "name": "Der Waldrichter", "kategorie": "alle", "beschreibung": "Jeder sucht in zwei Minuten den ungewöhnlichsten Gegenstand am Boden, ohne den Weg zu verlassen. Wer die wenigsten Münzen hat, spielt nicht mit, sondern ist Richter und kürt den Sieger.", "belohnung": {"sieger": 2, "richter": 1}}, "ein-langer-atem": {"pos": 120, "name": "Ein langer Atem", "kategorie": "alle", "beschreibung": "Alle holen gleichzeitig Luft und summen. Wer am längsten durchhält, gewinnt.", "belohnung": {"sieger": 2}}, "der-faehrtenleser": {"pos": 130, "name": "Der Fährtenleser", "kategorie": "einer", "beschreibung": "Der Einzelne versteckt einen kleinen Stein in einer Hand hinter dem Rücken. Die anderen einigen sich gemeinsam auf links oder rechts. Drei Runden. Errät die Gruppe mindestens 2 von 3, gewinnt sie.", "belohnung": {"einzeln": 3, "gruppe": 1}}, "die-geschichte-des-barden": {"pos": 140, "name": "Die Geschichte des Barden", "kategorie": "einer", "beschreibung": "Die Gruppe zeigt dem Einzelnen drei Dinge vom Wegesrand. Er muss in einer Minute eine Geschichte erzählen, in der alle drei vorkommen.", "belohnung": {"einzeln": 3, "scheitern": -1}}, "der-waechter-der-bruecke": {"pos": 150, "name": "Der Wächter der Brücke", "kategorie": "einer", "beschreibung": "Der Einzelne denkt an etwas, das alle gerade sehen können. Die Gruppe hat zusammen 10 Ja-Nein-Fragen, um es zu erraten.", "belohnung": {"einzeln": 3, "gruppe": 1}}, "pantomime-des-waldes": {"pos": 160, "name": "Pantomime des Waldes", "kategorie": "team", "beschreibung": "Abwechselnd stellt ein Spieler etwas aus dem Wald pantomimisch dar, zum Beispiel ein Tier oder einen Baum. Sein Team hat 30 Sekunden zum Raten. Nach drei Runden pro Team gewinnt das Team mit mehr Treffern.", "belohnung": {"team": 1}}, "gemeinsam-schaetzen": {"pos": 170, "name": "Gemeinsam schätzen", "kategorie": "team", "beschreibung": "Wählt einen Baum oder Punkt am Weg. Jedes Team einigt sich auf eine Schätzung, wie viele Schritte es bis dorthin sind. Einer zählt beim Gehen mit. Das Team, das näher dran ist, gewinnt.", "belohnung": {"team": 1}}, "die-zapfenjagd": {"pos": 180, "name": "Die Zapfenjagd", "kategorie": "team", "beschreibung": "Jedes Team sammelt zwei Minuten lang Tannenzapfen, die am Wegesrand liegen, ohne den Weg zu verlassen. Das Team mit mehr Zapfen gewinnt. Danach alles zurücklegen.", "belohnung": {"team": 2}}, "das-waldalphabet": {"pos": 190, "name": "Das Waldalphabet", "kategorie": "team", "beschreibung": "Die Teams nennen abwechselnd etwas aus dem Wald nach dem Alphabet: A wie Ameise, B wie Buche … Wer nicht weiterweiß, verliert. Schwierige Buchstaben wie Q oder X dürft ihr überspringen.", "belohnung": {"team": 1}}, "der-riese-und-die-zwerge": {"pos": 200, "name": "Der Riese und die Zwerge", "kategorie": "ungleich", "beschreibung": "Der Riese nennt in 45 Sekunden so viele Waldwörter wie möglich. Danach nennen die zwei Zwerge abwechselnd Wörter, aber nur 30 Sekunden lang. Wer mehr schafft, gewinnt.", "belohnung": {"riese": 3, "zwerge": 2, "einzelName": "Riese", "paarName": "Zwerge"}}}, "ereignisse": {"goldregen": {"pos": 10, "name": "Goldregen", "kategorie": "Segen", "sichtbarkeit": "oeffentlich", "beschreibung": "Ein Sonnenstrahl lässt etwas im Laub glitzern. Alle erhalten 1 Münze aus der Spielbank.", "wirkung": "goldregen"}, "der-steuereintreiber": {"pos": 20, "name": "Der Steuereintreiber", "kategorie": "Fluch", "sichtbarkeit": "oeffentlich", "beschreibung": "Ein Bote des Fürsten verlangt seinen Anteil. Alle zahlen 1 Münze an die Spielbank. Wer keine Münze hat, kommt davon.", "wirkung": "steuer"}, "gunst-der-waldgeister": {"pos": 30, "name": "Gunst der Waldgeister", "kategorie": "Segen", "sichtbarkeit": "oeffentlich", "beschreibung": "Die Geister helfen den Schwachen. Wer die wenigsten Münzen hat, erhält 3 Münzen. Bei Gleichstand sind alle Gleichplatzierten betroffen.", "wirkung": "gunst"}, "neid-der-gilde": {"pos": 40, "name": "Neid der Gilde", "kategorie": "Fluch", "sichtbarkeit": "oeffentlich", "beschreibung": "Wer die meisten Münzen hat, muss 2 davon an den Spieler mit den wenigsten Münzen abgeben. Bei Gleichstand sind alle Gleichplatzierten betroffen. Jeder der Reichsten gibt 2 ab, jeder der Ärmsten erhält 2.", "wirkung": "neid"}, "entlarvt": {"pos": 50, "name": "Entlarvt!", "kategorie": "Fluch", "sichtbarkeit": "oeffentlich", "beschreibung": "Wer sein Geheimnis verloren hat, ist verwundbar. Alle, deren Rolle schon erraten wurde, verlieren 1 Münze.", "wirkung": "entlarvt"}, "meister-der-tarnung": {"pos": 60, "name": "Meister der Tarnung", "kategorie": "Segen", "sichtbarkeit": "oeffentlich", "beschreibung": "Alle, deren Rolle noch nicht erraten wurde, erhalten 1 Münze.", "wirkung": "tarnung"}, "das-duell-an-der-brue alle Gleichplatzierten betroffen. Sie entscheiden gemeinsam, und bei der zweiten Wahl erhält jeder von ihnen 2.", "wirkung": "scheideweg"}, "die-nacht-der-seher": {"pos": 130, "name": "Die Nacht der Seher", "kategorie": "Segen, hält an", "sichtbarkeit": "oeffentlich", "beschreibung": "Bis zum nächsten Ereignis bringt ein richtiger Tipp beim Raten 5 statt 3 Münzen.", "wirkung": "seher"}, "stille-lichtung": {"pos": 140, "name": "Stille Lichtung", "kategorie": "Ruhe", "sichtbarkeit": "oeffentlich", "beschreibung": "Nichts geschieht. Der Wald ist friedlich. Atmet durch und genießt den Moment.", "wirkung": "ruhe"}, "der-alte-wegweiser": {"pos": 150, "name": "Der alte Wegweiser", "kategorie": "Ruhe", "sichtbarkeit": "oeffentlich", "beschreibung": "Ihr kommt an einem alten Wegweiser vorbei. Seine Schrift ist längst verwittert. Nichts geschieht, doch irgendwo beobachtet euch die Gilde.", "wirkung": "ruhe"}, "vogelgesang": {"pos": 160, "name": "Vogelgesang", "kategorie": "Ruhe", "sichtbarkeit": "oeffentlich", "beschreibung": "Über euch singt eine Amsel. Nichts geschieht. Lauscht einen Moment, bevor es weitergeht.", "wirkung": "ruhe"}}}, "taverne": {"pos": 20, "name": "Die Sturmnacht im Goldenen Krug", "setting": "Drinnen · für einen Abend am Tisch mit Essen und Trinken", "geschichte": {"titel": "Die Sturmnacht im Goldenen Krug", "absaetze": ["Draußen tobt ein Sturm über Valdrien, wie ihn selbst die Alten noch nicht erlebt haben. Die Wege sind überschwemmt, die Brücken gesperrt, und so sitzt ihr fest: eine bunt gemischte Runde Reisender in der Taverne »Zum Goldenen Krug«.", "Der Wirt stellt Krüge und eine dampfende Suppe auf den Tisch und macht euch ein Angebot: »Wer heute Nacht die meisten Münzen sammelt, dessen Name kommt an die Wand der Stammgäste. Und Stammgäste trinken bei mir für immer umsonst.«", "Doch niemand an diesem Tisch ist der, für den er sich ausgibt. Jeder hat ein Geheimnis, und jeder will an diese Wand. Esst, trinkt, spielt und beobachtet eure Tischnachbarn genau."], "schluss": "Bis der Sturm sich legt, ist noch viel Zeit. Die Nacht beginnt!"}, "schlusstext": {"titel": "Ein neuer Stammgast", "vorher": ["Der Sturm hat sich gelegt, die Kerzen sind heruntergebrannt, und die Münzen sind gezählt.", "Der Wirt nimmt Hammer und Nagel und hängt eine neue Tafel an die Wand:"], "nachher": ["Willkommen unter den Stammgästen des Goldenen Krugs! Ab heute ist dein Krug nie mehr leer, und dein Name hängt für immer an dieser Wand.", "Herzlichen Glückwunsch, {sieger}! Die nächste Runde geht aufs Haus."]}, "begriffe": {"frage": "Wer sitzt mit am Tisch?", "spieler": "Gast", "mehrzahl": "Gäste", "dativ": "Gästen", "beenden": "Die Nacht beenden"}, "rollen": {"wendelin": {"pos": 10, "name": "Wendelin", "bezeichnung": "der Wirt", "startkapital": 5, "hintergrund": "Wendelin ist Herr über Krüge, Kasse und Hausrecht. Was an seinem Tisch passiert, entgeht ihm nicht.", "charakter": "", "merkmale": ["Achtet darauf, dass alle versorgt sind.", "Kommentiert gern das Geschehen am Tisch.", "Sorgt für Ordnung, wenn es laut wird."], "faehigkeit": {"name": "Hausrecht", "text": "Einmal im Spiel sieht Wendelin heimlich die nächste Ereigniskarte an und entscheidet, ob sie gespielt oder abgelegt wird. Spielt er sie, erhält er 1 Münze.", "mechanik": "hausrecht"}, "aufgabe": {"name": "Volle Kasse", "text": "Besitze am Ende mindestens 8 Münzen.", "bonus": 3}}, "mathilda": {"pos": 20, "name": "Mathilda", "bezeichnung": "die Mundschenkin", "startkapital": 4, "hintergrund": "Mathilda kennt jeden Gast beim Namen und jedes Gerücht, das über den Tresen geht.", "charakter": "", "merkmale": ["Aufmerksam und gesprächig.", "Schenkt gern nach, auch Wasser.", "Fragt die Leute neugierig aus."], "faehigkeit": {"name": "Trinkgeld", "text": "Einmal im Spiel erhält Mathilda nach einem Minispiel, bei dem sie mitgespielt hat, 2 Münzen, egal ob sie gewonnen oder verloren hat.", "mechanik": "trinkgeld"}, "aufgabe": {"name": "Prost!", "text": "Mache ein Foto, auf dem mindestens drei Gläser beim Anstoßen zu sehen sind.", "bonus": 2}}, "torben": {"pos": 30, "name": "Torben", "bezeichnung": "der Trunkenbold", "startkapital": 3, "hintergrund": "Torben wirkt, als hätte er einen Krug zu viel gehabt. Aber er bekommt mehr mit, als alle denken. (Die Rolle wird nur gespielt, getrunken wird nicht mehr als sonst.)", "charakter": "", "merkmale": ["Laut und gesellig.", "Erzählt wirre Geschichten.", "Verwechselt gern Namen."], "faehigkeit": {"name": "Glück des Narren", "text": "Einmal im Spiel zieht Torben eine zufällige Belohnung von 1 bis 4 Münzen.", "mechanik": "narr"}, "aufgabe": {"name": "Geliehen ist geliehen", "text": "Besitze am Ende einen Gegenstand, den dir ein Mitspieler freiwillig geliehen hat, ohne dass er ihn zurückverlangt hat. Der Besitzer bestätigt das.", "bonus": 3}}, "klara": {"pos": 40, "name": "Klara", "bezeichnung": "die Köchin", "startkapital": 4, "hintergrund": "Aus Klaras Küche kommt die beste Suppe von ganz Valdrien. Wer einmal bei ihr gegessen hat, kommt wieder.", "charakter": "", "merkmale": ["Spricht gern übers Essen.", "Bietet anderen etwas an.", "Hat zu allem ein Rezept."], "faehigkeit": {"name": "Stärkende Suppe", "text": "Verliert Klara durch ein Ereignis Münzen, erhält sie einmal im Spiel direkt danach 3 Münzen.", "mechanik": "suppe"}, "aufgabe": {"name": "Geheimrezept", "text": "Lege auf deinem Teller heimlich ein Gesicht aus Essen oder Besteck und fotografiere es.", "bonus": 2}}, "severin": {"pos": 50, "name": "Severin", "bezeichnung": "der Spielmann", "startkapital": 4, "hintergrund": "Mit Laute und Liedern zieht Severin von Taverne zu Taverne. Wo er spielt, ist der Saal voll.", "charakter": "", "merkmale": ["Summt vor sich hin.", "Reimt gern.", "Macht aus allem eine Geschichte."], "faehigkeit": {"name": "Zugabe", "text": "Einmal im Spiel wählt Severin aus drei Minispielen eins aus und spielt mit. Gewinnt er, erhält er 2 zusätzliche Münzen.", "mechanik": "zugabe"}, "aufgabe": {"name": "Ohrwurm", "text": "Nimm ein kurzes Vide    nie eine Verbindung, nimmt sie den eingebauten Inhalt ganz unten in
   EINGEBAUTER_INHALT (derselbe Aufbau wie die JSON-Datei im CMS).
   ----------------------------------------------------------------- */

// Namen der Minispiel-Kategorien
const KATEGORIEN = {
  duell: "Duell (1 gegen 1)",
  alle: "Alle gegen alle",
  einer: "Einer gegen alle",
  team: "Team gegen Team",
  ungleich: "1 gegen 2"
};

// Hier landen die umgewandelten Abenteuer: ABENTEUER.wald, ABENTEUER.taverne, ...
const ABENTEUER = {};
let WELT = { name: "Valdrien", spruch: "Ein Land voller Abenteuer, Geheimnisse und Gefährten, denen du nicht ganz trauen solltest." };
let letzterInhalt = null;     // der zuletzt angewendete Inhalt (Rohdaten aus dem CMS)
let inhaltVersion = 0;        // Versionsnummer aus Supabase
let inhaltQuelle = "eingebaut"; // eingebaut | gespeichert | live

// Text sicher machen, bevor er in die Seite kommt
function textSicher(wert) {
  return String(wert ?? "").replace(/[&<>"']/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}
function zahl(wert, ersatz) { return typeof wert === "number" && isFinite(wert) ? wert : ersatz; }
function nachPos(obj) {
  return Object.entries(obj || {}).sort((a, b) => (a[1].pos ?? 0) - (b[1].pos ?? 0) || a[0].localeCompare(b[0]));
}

// Eine Rolle aus dem CMS in das Format der App bringen
function rolleUmwandeln(id, r) {
  return {
    id,
    name: textSicher(r.name || "Ohne Namen"),
    rolle: textSicher(r.bezeichnung || ""),
    start: zahl(r.startkapital, 4),
    einfuehrung: textSicher(r.hintergrund || ""),
    charakter: textSicher(r.charakter || ""),
    merkmale: (Array.isArray(r.merkmale) ? r.merkmale : []).map(textSicher),
    faehigkeit: {
      code: r.faehigkeit?.mechanik || "",
      name: textSicher(r.faehigkeit?.name || "Fähigkeit"),
      text: textSicher(r.faehigkeit?.text || "")
    },
    aufgabe: {
      name: textSicher(r.aufgabe?.name || "Geheime Aufgabe"),
      text: textSicher(r.aufgabe?.text || ""),
      bonus: zahl(r.aufgabe?.bonus, 0)
    }
  };
}

// Ein Ereignis aus dem CMS. Private Ereignisse sind (noch) nicht im Stapel.
function ereignisUmwandeln(id, e) {
  return {
    id,
    titel: textSicher(e.name || "Ohne Namen"),
    art: textSicher(e.kategorie || ""),
    wirkung: e.wirkung || "ruhe",
    text: textSicher(e.beschreibung || ""),
    privat: e.sichtbarkeit === "privat",
    geloescht: e.sichtbarkeit === "privat"
  };
}

// Ein Minispiel aus dem CMS. Die Belohnungen kommen als Zahlen dazu (sieger, verlierer, einzeln, ...).
function minispielUmwandeln(id, m) {
  const b = m.belohnung || {};
  const kategorie = KATEGORIEN[m.kategorie] ? m.kategorie : "alle";
  const mg = { id, titel: textSicher(m.name || "Ohne Namen"), kategorie, text: textSicher(m.beschreibung || "") };
  const felder = { duell: ["sieger", "verlierer"], alle: ["sieger", "richter"], einer: ["einzeln", "gruppe", "scheitern"], team: ["team"], ungleich: ["riese", "zwerge"] }[kategorie];
  felder.forEach(f => { if (typeof b[f] === "number") mg[f] = b[f]; });
  // Pflichtwerte, damit nichts "undefined" anzeigt
  if (kategorie === "duell" || kategorie === "alle") mg.sieger = zahl(mg.sieger, 0);
  if (kategorie === "einer") mg.einzeln = zahl(mg.einzeln, 0);
  if (kategorie === "team") mg.team = zahl(mg.team, 0);
  if (kategorie === "ungleich") {
    mg.riese = zahl(mg.riese, 0); mg.zwerge = zahl(mg.zwerge, 0);
    mg.einzelName = textSicher(b.einzelName || "Einzelner"); mg.paarName = textSicher(b.paarName || "Paar");
  }
  return mg;
}

// Ersatz, falls ein Eintrag während einer laufenden Partie gelöscht wurde
function platzhalter(art, id) {
  if (art === "rollen") return rolleUmwandeln(id, { name: "Gelöschte Rolle", startkapital: 0 });
  if (art === "ereignisse") return ereignisUmwandeln(id, { name: "Gelöschtes Ereignis", wirkung: "ruhe" });
  return minispielUmwandeln(id, { name: "Gelöschtes Minispiel", kategorie: "alle" });
}

/* Ein ganzes Abenteuer umwandeln.
   reihenfolge: Während einer Partie bleibt jede Rolle, jedes Ereignis und jedes
   Minispiel an seinem Platz. Neue Einträge kommen hinten dazu, gelöschte bleiben
   als "geloescht" stehen. So verrutscht nichts, wenn im CMS jemand etwas ändert. */
function abenteuerUmwandeln(id, a, vorher, reihenfolge) {
  const ordnen = (art, umwandeln) => {
    const neu = nachPos(a[art]);
    const neuNachId = new Map(neu);
    const ergebnis = [];
    const gesehen = new Set();
    ((reihenfolge && reihenfolge[art]) || []).forEach(eid => {
      gesehen.add(eid);
      if (neuNachId.has(eid)) ergebnis.push(umwandeln(eid, neuNachId.get(eid)));
      else {
        const alt = vorher && vorher[art] && vorher[art].find(x => x.id === eid);
        ergebnis.push(Object.assign({}, alt || platzhalter(art, eid), { geloescht: true }));
      }
    });
    neu.forEach(([eid, w]) => { if (!gesehen.has(eid)) ergebnis.push(umwandeln(eid, w)); });
    return ergebnis;
  };
  const g = a.geschichte || {}, s = a.schlusstext || {}, w = a.begriffe || {};
  const titel = textSicher(s.titel || "Das Abenteuer ist vorbei");
  const vorherText = (s.vorher || []).map(textSicher);
  const nachherText = (s.nachher || []).map(textSicher);
  const abenteuer = {
    id,
    titel: textSicher(a.name || "Neues Abenteuer"),
    kurz: textSicher(a.setting || ""),
    frage: textSicher(w.frage || "Wer spielt mit?"),
    spieler: textSicher(w.spieler || "Spieler"),
    mehrzahl: textSicher(w.mehrzahl || "Spieler"),
    dativ: textSicher(w.dativ || "Spielern"),
    beenden: textSicher(w.beenden || "Abenteuer beenden"),
    einfuehrungTitel: textSicher(g.titel || a.name || ""),
    einfuehrung: (g.absaetze || []).map(textSicher),
    einfuehrungSchluss: textSicher(g.schluss || ""),
    rollen: ordnen("rollen", rolleUmwandeln),
    ereignisse: ordnen("ereignisse", ereignisUmwandeln),
    minispiele: ordnen("minispiele", minispielUmwandeln),
    // Der Schlusstext: {sieger} wird durch den Namen ersetzt, der letzte Absatz ist kursiv
    abschluss: (sieger, mehrere) => {
      const fuellen = p => p.split("{sieger}").join(sieger);
      return `
        <p class="zier">✦ ✦ ✦</p>
        <h1>${titel}</h1>
        ${vorherText.length ? `<div class="erzaehlung">${vorherText.map(p => `<p>${fuellen(p)}</p>`).join("")}</div>` : ""}
        <p class="sieger">${sieger}</p>
        ${nachherText.length ? `<div class="erzaehlung">${nachherText.map((p, i) => i === nachherText.length - 1
          ? `<p><em>${fuellen(p)}</em></p>` : `<p>${fuellen(p)}</p>`).join("")}</div>` : ""}`;
    }
  };
  const rollenAktiv = abenteuer.rollen.filter(r => !r.geloescht).length;
  const ereignisseAktiv = abenteuer.ereignisse.filter(e => !e.geloescht).length;
  abenteuer.spielbar = rollenAktiv >= 3 && ereignisseAktiv >= 1;
  return abenteuer;
}

// Den Inhalt anwenden: ABENTEUER neu aufbauen, laufende Partie bleibt stimmig
function inhaltAnwenden(daten, quelle) {
  if (!daten || typeof daten.abenteuer !== "object" || !Object.keys(daten.abenteuer).length) return false;
  const laufend = Boolean(spiel && spiel.spieler && spiel.spieler.length && spiel.abenteuer);
  const vorher = Object.assign({}, ABENTEUER);
  Object.keys(ABENTEUER).forEach(k => delete ABENTEUER[k]);
  for (const [id, a] of nachPos(daten.abenteuer)) {
    const reihenfolge = laufend && spiel.reihenfolge && spiel.reihenfolge.abenteuer === id ? spiel.reihenfolge : null;
    ABENTEUER[id] = abenteuerUmwandeln(id, a, vorher[id], reihenfolge);
  }
  // Das laufende Abenteuer wurde im CMS gelöscht? Dann für diese Partie behalten.
  if (laufend && !ABENTEUER[spiel.abenteuer] && vorher[spiel.abenteuer]) {
    ABENTEUER[spiel.abenteuer] = Object.assign(vorher[spiel.abenteuer], { versteckt: true });
  }
  if (daten.welt) WELT = { name: textSicher(daten.welt.name || "Valdrien"), spruch: textSicher(daten.welt.spruch || "") };
  letzterInhalt = daten;
  inhaltQuelle = quelle;
  abenteuerSetzen(spiel.abenteuer);
  if (laufend) {
    reihenfolgeMerken();
    // Gelöschte oder privat gewordene Ereignisse aus dem Stapel nehmen
    if (Array.isArray(spiel.ereignisStapel)) spiel.ereignisStapel = spiel.ereignisStapel.filter(nr => EREIGNISSE[nr] && !EREIGNISSE[nr].geloescht);
  }
  return true;
}

// Merkt sich für die laufende Partie, an welchem Platz welcher Eintrag steht
function reihenfolgeMerken() {
  spiel.reihenfolge = {
    abenteuer: spiel.abenteuer,
    rollen: ROLLEN.map(r => r.id),
    ereignisse: EREIGNISSE.map(e => e.id),
    minispiele: MINISPIELE.map(m => m.id)
  };
}

// Nur die Nummern der Einträge, die es noch gibt (nicht gelöscht, nicht privat)
function aktive(liste) { return liste.map((_, i) => i).filter(i => !liste[i].geloescht); }

// Die Daten des gerade gewählten Abenteuers. Alle anderen Teile der App nutzen diese drei Listen.
let ROLLEN = [];
let EREIGNISSE = [];
let MINISPIELE = [];

// Das erste Abenteuer, falls das gewählte (noch) nicht da ist
function erstesAbenteuer() { return ABENTEUER[Object.keys(ABENTEUER)[0]]; }

function abenteuerSetzen(id) {
  const a = ABENTEUER[id] || erstesAbenteuer();
  if (!a) return;
  ROLLEN = a.rollen;
  EREIGNISSE = a.ereignisse;
  MINISPIELE = a.minispiele;
}

// Das gerade gewählte Abenteuer
function A() { return ABENTEUER[spiel.abenteuer] || erstesAbenteuer(); }

// So viele Spieler wie es (nicht gelöschte) Rollen gibt
function maxSpieler() { return aktive(ROLLEN).length; }

const MIN_SPIELER = 3;

// Die Adresse der veröffentlichten App. Der QR-Code auf jeder Rollenkarte führt hierhin.
// Ziehst du die App einmal um (z. B. auf eine eigene Webseite), trägst du hier die neue Adresse ein.
// Das ist automatisch die Adresse, unter der diese Seite gerade läuft (z. B. dein GitHub Pages).
const SPIELER_LINK = location.origin + location.pathname;

// Verbindung zum Spieltisch: Die Münzen jedes Spielers liegen hier, damit sein Handy sie lesen kann.
let tischDb = null;           // die Datenbank, sobald die App bei Claude angemeldet läuft
let tischLetzte = {};         // was zuletzt pro Spieler übertragen wurde (damit nichts doppelt geschrieben wird)
let tischLaeuft = false, tischNochmal = false;
let eigene = null;            // gefüllt, wenn diese Seite die eigene Seite eines Spielers ist
const EREIGNIS_MINUTEN = 15; // Voreinstellung: alle wie viele Minuten automatisch ein Ereignis kommt

// Einstellungen bleiben auch für die nächste Partie gespeichert (eigener Speicherplatz)
let einstellungen = { minuten: EREIGNIS_MINUTEN };
try { Object.assign(einstellungen, JSON.parse(localStorage.getItem("valdrien-einstellungen") || "{}")); } catch (e) {}
function minuten() { return einstellungen.minuten || EREIGNIS_MINUTEN; }
function einstellungSetzen(schluessel, wert) {
  einstellungen[schluessel] = wert;
  try { localStorage.setItem("valdrien-einstellungen", JSON.stringify(einstellungen)); } catch (e) {}
  zeichnen();
}

// Kleine Merker, die nicht gespeichert werden müssen
let beendenFragen = false;   // zeigt die Rückfrage "Wirklich beenden?"
let korrekturOffen = false;  // ist "Status korrigieren" in der Münzkasse aufgeklappt?
let schicht = null;          // welche Tafel von unten offen ist: "menue", "beutel" oder keine

/* -----------------------------------------------------------------
   DER RAHMEN: Zurück-Pfeil, Zahnrad-Menü und Geldbeutel
   ----------------------------------------------------------------- */

// Seiten, die man von überall über das Zahnrad oder den Geldbeutel öffnet
const NACHSCHLAGEN = ["regeln", "einstellungen", "anleitung", "spiel"];

// Öffnet eine Nachschlage-Seite und merkt sich, wohin der Zurück-Pfeil danach führt
function oeffne(ziel) {
  spiel.zurueckZu = spiel.zurueckZu || {};
  const jetzt = spiel.bildschirm;
  if (jetzt !== ziel) {
    spiel.zurueckZu[ziel] = NACHSCHLAGEN.includes(jetzt) ? (spiel.zurueckZu[jetzt] || "start") : jetzt;
  }
  spiel.aufgedeckt = false;                 // geheime Karten beim Wegschalten verdecken
  if (spiel.meine) spiel.meine.offen = false;
  zeige(ziel);
}

// Wohin führt der Zurück-Pfeil gerade? null = auf dieser Seite gibt es kein Zurück
function zurueckWeg() {
  const geh = ziel => () => zeige(ziel);
  const s = spiel.bildschirm;
  if (NACHSCHLAGEN.includes(s)) {
    const ziel = (spiel.zurueckZu || {})[s] || (spiel.abenteuerLaeuft ? "uebersicht" : "start");
    return geh(ziel);
  }
  switch (s) {
    case "titel": return geh("start");
    case "namen": return geh("titel");
    case "uebersicht": return geh("start");
    case "rollen": return geh("uebersicht");
    case "meinerolle": {
      const m = spiel.meine;
      if (!m || m.wer === null) return geh("uebersicht");
      if (!m.offen) return meineRolleBeginnen;
      return () => { spiel.meine = null; zeige("uebersicht"); };
    }
    case "raten": {
      const r = spiel.raten || {};
      if (r.schritt === "wer" || r.schritt === "falsch" || r.schritt === "richtig") return geh("uebersicht");
      if (r.schritt === "setzen") return ratenBeginnen;
      return null; // Münze ist gesetzt: erst das Ergebnis eintragen
    }
    case "faehigkeit": {
      const f = spiel.faehigkeit || {};
      if (f.schritt === "wer") return geh("uebersicht");
      if (f.schritt === "ansehen") return null; // Karte gesehen: jetzt muss entschieden werden
      return spiel.spieler[f.wer] && spiel.spieler[f.wer].benutzt ? geh("uebersicht") : faehigkeitBeginnen;
    }
    case "ereignis": return ereignisOffen() ? null : geh("uebersicht");
    case "minispiel": return spiel.minispiel && spiel.minispiel.ausEreignis ? geh("ereignis") : geh("uebersicht");
    case "aufgaben": return weiterspielen;
    case "ende": return geh("aufgaben");
  }
  return null; // Hauptmenü, Rollen verteilen und Geschichte
}

function zurueckTippen() {
  const weg = zurueckWeg();
  if (weg) weg();
}

// Zeigt die drei Rahmenknöpfe passend zur Seite
function rahmenZeichnen() {
  const zurueck = document.getElementById("knopf-zurueck");
  const beutel = document.getElementById("knopf-beutel");
  if (zurueck) zurueck.hidden = !zurueckWeg();
  const ohneBeutel = ["start", "titel", "namen", "weitergabe", "einfuehrung"];
  if (beutel) beutel.hidden = !(spiel.spieler && spiel.spieler.length) || ohneBeutel.includes(spiel.bildschirm);
  const ebene = document.getElementById("schicht");
  if (!ebene) return;
  ebene.hidden = !schicht;
  ebene.innerHTML = schicht === "menue" ? tafelMenue() : schicht === "beutel" ? tafelBeutel() : "";
}

function schichtOeffnen(welche) { schicht = welche; beendenFragen = false; rahmenZeichnen(); }
function schichtSchliessen() { schicht = null; beendenFragen = false; rahmenZeichnen(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && schicht) schichtSchliessen(); });

const SCHLIESSEN = `<button class="rund" aria-label="Schließen" onclick="schichtSchliessen()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>`;

// Das Zahnrad-Menü
function tafelMenue() {
  const eintrag = (sym, text, aktion) => `<button class="menue-eintrag" onclick="${aktion}">${sym}<span>${text}</span></button>`;
  const imSpiel = spiel.abenteuerLaeuft && spiel.spieler && spiel.spieler.length;
  return `

      <div class="tafel-kopf"><h2>Menü</h2>${SCHLIESSEN}</div>

        ${eintrag(symbol("regeln"), "Regelwerk", "oeffne('regeln')")}
        ${eintrag(symbol("blitz"), "In einer Minute erklärt", "oeffne('anleitung')")}
        ${eintrag(symbol("zahnrad"), "Einstellungen", "oeffne('einstellungen')")}
      </div>
      ${imSpiel ? `
        <span class="menue-trenner">Dieses Abenteuer</span>
        <div class="menue-liste">
          ${eintrag(symbol("ereignis"), "Ereigniskarte jetzt ziehen", "schicht = null; ereignisZiehen(false)")}
          ${beendenFragen ? "" : eintrag(symbol("flagge"), A().beenden, "beendenFragen = true; rahmenZeichnen()")}
        </div>
        ${beendenFragen ? `
          <div class="rueckfrage" role="alertdialog" aria-labelledby="rueckfrage-titel">
            <strong id="rueckfrage-titel">${A().beenden}?</strong>
            <p class="leise">Danach werden alle Rollen aufgedeckt und die Münzen gezählt.</p>
            <button class="knopf" onclick="pruefungBeenden()">Ja, jetzt beenden</button>
          </div>` : ""}` : ""}
    </div>`;
}

// Der Geldbeutel: wer hat wie viele Münzen?
function tafelBeutel() {
  return `
    <div class="tafel-unten" role="dialog" aria-modal="true" aria-label="Münzen">
      <div class="tafel-kopf"><h2>Münzen</h2>${SCHLIESSEN}</div>
      ${standTafel()}
      <button class="knopf-leise" onclick="oeffne('spiel')">Münzen von Hand ändern</button>
    </div>`;
}

/* -----------------------------------------------------------------
   B) DER SPIELSTAND: alles, was sich während einer Partie ändert

let spiel = {
  bildschirm: "start",     // welcher Bildschirm gerade zu sehen ist

  spieler: [],             // wird beim Verteilen gefüllt

};

function laden() {

/* -----------------------------------------------------------------
   C) HILFSFUNKTIONEN
   ----------------------------------------------------------------- */

// Mischt eine Liste zufällig (der "Fisher-Yates"-Trick).
function mischen(liste) {
  const kopie = [...liste];
  for (let i = kopie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
  }
  return kopie;
}

// Schützt Namen vor Sonderzeichen, die das HTML kaputt machen würden.
function sicher(text) {
  return String(text).replace(/[&<>"]/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));
}

/* -----------------------------------------------------------------
   DAS WALDBILD
   Das Bild ist kein Foto, sondern wird mit Code gezeichnet (SVG).
   Die "saat" bestimmt, wo die Bäume stehen: andere Zahl = anderer Wald.
   ----------------------------------------------------------------- */

// Ein Zufallsgenerator, der bei gleicher Saat immer gleich würfelt
function zufallMitSaat(saat) {
  return function () {
    saat = (saat + 0x6D2B79F5) | 0;
    let t = Math.imul(saat ^ (saat >>> 15), 1 | saat);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Eine Tanne aus drei Dreiecken und einem Stamm
function tanne(x, boden, hoehe, klasse) {
  let form = `<rect class="${klasse}" x="${x - hoehe * 0.03}" y="${boden - hoehe * 0.14}" width="${hoehe * 0.06}" height="${hoehe * 0.14}"/>`;
  for (let i = 0; i < 3; i++) {
    const unten = boden - hoehe * 0.12 - i * hoehe * 0.26;
    const oben = Math.max(unten - hoehe * 0.5, boden - hoehe);
    const breite = hoehe * 0.42 * (1 - i * 0.25);
    form += `<polygon class="${klasse}" points="${x - breite},${unten} ${x},${oben} ${x + breite},${unten}"/>`;
  }
  return form;
}

// Ein Laubbaum aus drei Kreisen und einem Stamm
function laubbaum(x, boden, hoehe, klasse) {
  const r = hoehe * 0.28;
  return `<rect class="${klasse}" x="${x - hoehe * 0.035}" y="${boden - hoehe * 0.45}" width="${hoehe * 0.07}" height="${hoehe * 0.45}"/>
    <circle class="${klasse}" cx="${x}" cy="${boden - hoehe + r}" r="${r}"/>
    <circle class="${klasse}" cx="${x - r * 0.8}" cy="${boden - hoehe * 0.55}" r="${r * 0.85}"/>
    <circle class="${klasse}" cx="${x + r * 0.8}" cy="${boden - hoehe * 0.55}" r="${r * 0.85}"/>`;
}

function waldbild(saat) {
  const zufall = zufallMitSaat(saat);
  const zwischen = (a, b) => a + zufall() * (b - a);

  // Eine Reihe Bäume zwischen vonX und bisX
  const baumreihe = (anzahl, vonX, bisX, boden, hMin, hMax, klasse, laubAnteil) => {
    let teil = "";
    for (let i = 0; i < anzahl; i++) {
      const x = vonX + (i + zwischen(0.15, 0.85)) * (bisX - vonX) / anzahl;
      const h = zwischen(hMin, hMax);
      const y = boden + zwischen(-5, 5);
      teil += zufall() < laubAnteil ? laubbaum(x, y, h, klasse) : tanne(x, y, h, klasse);
    }
    return teil;
  };

  // Lichtstrahlen, die von oben durch die Bäume fallen
  let strahlen = "";
  for (let i = 0; i < 6; i++) {
    const unten = 50 + i * 60 + zwischen(-12, 12);
    strahlen += `<polygon class="strahl" points="${188 + i * 5},0 ${206 + i * 5},0 ${unten + 20},260 ${unten - 20},260"/>`;
  }

  // Glühwürmchen
  let glueh = "";
  for (let i = 0; i < 14; i++) {
    glueh += `<circle class="glueh" cx="${zwischen(20, 380)}" cy="${zwischen(120, 250)}" r="${zwischen(1.2, 2.4)}" style="animation-delay:${zwischen(0, 3.4)}s"/>`;
  }

  return `
    <figure class="waldbild">
      <svg viewBox="0 0 400 260" role="img" aria-label="Ein Waldweg führt zwischen alten Bäumen ins Licht">
        <defs>
          <linearGradient id="himmel-${saat}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="himmel-oben"/><stop offset="1" class="himmel-unten"/>
          </linearGradient>
          <radialGradient id="glanz-${saat}">
            <stop offset="0" class="glanz-mitte"/><stop offset="1" class="glanz-rand"/>
          </radialGradient>
        </defs>
        <rect width="400" height="260" fill="url(#himmel-${saat})"/>
        <circle cx="200" cy="110" r="120" fill="url(#glanz-${saat})"/>
        ${strahlen}
        ${baumreihe(14, -20, 420, 205, 55, 95, "baum-hinten", 0.4)}
        <path class="boden" d="M0,214 Q100,202 200,211 T400,208 L400,260 L0,260 Z"/>
        ${baumreihe(5, -20, 160, 232, 95, 145, "baum-mitte", 0.3)}
        ${baumreihe(5, 240, 420, 232, 95, 145, "baum-mitte", 0.3)}
        <path class="weg" d="M195,211 L205,211 Q232,230 262,260 L138,260 Q176,232 195,211 Z"/>
        ${baumreihe(2, -40, 90, 272, 175, 225, "baum-vorne", 0)}
        ${baumreihe(2, 310, 440, 272, 175, 225, "baum-vorne", 0)}
        ${glueh}
      </svg>
    </figure>`;
}

// Wechselt den Bildschirm und zeichnet alles neu.
function zeige(bildschirm) {
  spiel.bildschirm = bildschirm;
  beendenFragen = false;
  schicht = null;
  // Zurück auf der Übersicht und kein Zeitgeber läuft? Dann 15 Minuten neu starten.
  if (bildschirm === "uebersicht" && spiel.abenteuerLaeuft && !spiel.timerEnde) {
    spiel.timerEnde = Date.now() + minuten() * 60000;
  }
  speichern();
  zeichnen();
  window.scrollTo(0, 0);
}

function abenteuerBild(id, klein) {
  if (id === "wald") return klein ? `<span class="abenteuer-bild abenteuer-bild-wald"></span>` : "";

  const saat = [...id].reduce((s, z) => s + z.charCodeAt(0), 0);
  return klein ? `<span class="abenteuer-bild abenteuer-bild-gezeichnet">${waldbild(saat)}</span>` : `<figure class="tavernenbild">${waldbild(saat)}</figure>`;
}

  }
  return `
    <svg viewBox="0 0 400 260" ${ausschnitt ? 'preserveAspectRatio="xMidYMid slice"' : ""} role="img" aria-label="Eine Taverne bei Nacht: Sturm vor dem Fenster, ein Feuer im Kamin, Krüge und eine Kerze auf dem Tisch">

      <rect class="rahmen" x="40" y="40" width="110" height="120"/>
      <line class="rahmen" x1="95" y1="40" x2="95" y2="160"/>
      <line class="rahmen" x1="40" y1="100" x2="150" y2="100"/>

      <!-- Kamin -->
      <rect class="stein" x="252" y="70" width="124" height="135"/>
      <rect class="stein-sims" x="244" y="64" width="140" height="12"/>
      <path class="loch" d="M270 205 V140 Q314 104 358 140 V205 Z"/>
      <g class="feuer">
        <path class="flamme flamme-a" d="M292 205 Q286 178 300 160 Q302 180 312 182 Q316 166 326 156 Q340 182 334 205 Z"/>

        <rect x="120" y="170" width="32" height="40" rx="3"/>
        <ellipse class="schaum" cx="136" cy="170" rx="18" ry="6"/>

        <ellipse class="schaum" cx="198" cy="176" rx="16" ry="5"/>
      </g>

      <!-- Kerze -->
      <rect class="kerze" x="226" y="182" width="12" height="28" rx="2"/>

    </svg>`;
}
