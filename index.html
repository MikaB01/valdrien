<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valdrien</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valdrien">
<meta name="theme-color" content="#2f4a33">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/game.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="connection.js"></script>
</head>
<body>

<div id="backdrop" hidden></div>
<nav class="app-bar" aria-label="Spielsteuerung"><div class="app-bar-inner">
  <button class="bar-button" id="btn-back" aria-label="Zurück" onclick="goBack()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
    <span>Zurück</span>
  </button>
  <button class="purse-button" id="btn-purse" aria-label="Münzen aller Spieler zeigen" onclick="openSheet('purse')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h6l1.6-3.2c-1.5-.6-3-.3-4.6.4-1.6-.7-3.1-1-4.6-.4z"/><path d="M9 6.5C5.6 9.4 4 12.6 4 15.4 4 19 7.2 21 12 21s8-2 8-5.6c0-2.8-1.6-6-5-8.9"/><path d="M12 11v6M10 12.6c0-.9.9-1.4 2-1.4s2 .5 2 1.3-.9 1.2-2 1.4-2 .6-2 1.4.9 1.4 2 1.4 2-.5 2-1.3"/></svg>
  </button>
  <button class="bar-button" id="btn-menu" aria-label="Menü: Regelwerk und Einstellungen" onclick="openSheet('menu')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/><circle cx="12" cy="12" r="6.6"/></svg>
    <span>Menü</span>
  </button>
</div></nav>
<div id="sheet" class="sheet" hidden onclick="if (event.target === this) closeSheet()"></div>
<main id="app"></main>

<!-- Order matters: later scripts may use everything defined above them; main.js starts the app. -->
<script src="js/shared/helpers.js"></script>
<script src="js/shared/catalog.js"></script>
<script src="js/shared/content-format.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="content/initial-content.js"></script>

<script src="js/game/rules.js"></script>
<script src="js/game/server.js"></script>
<script src="js/game/content.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/artwork.js"></script>
<script src="js/game/frame.js"></script>

<script src="js/game/menu.js"></script>
<script src="js/game/rulebook.js"></script>
<script src="js/game/setup.js"></script>
<script src="js/game/overview.js"></script>
<script src="js/game/timer.js"></script>
<script src="js/game/guessing.js"></script>
<script src="js/game/abilities.js"></script>
<script src="js/game/events.js"></script>
<script src="js/game/effects.js"></script>
<script src="js/game/minigames.js"></script>
<script src="js/game/ending.js"></script>
<script src="js/game/player-page.js"></script>
<script src="js/game/speech.js"></script>
<script src="js/game/music.js"></script>

<script src="js/game/main.js"></script>
</body>
</html>
